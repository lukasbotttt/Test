    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 294;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const pulse = (el, f, s) => { tl.set(el, { scale: s }, G(f)); tl.to(el, { scale: 1, duration: D(9), ease: "power2.out" }, G(f)); };

        tl.fromTo("#s4cam", { scale: 1.04 }, { scale: 1, duration: D(66), ease: "power1.out" }, G(297));
        tl.fromTo("#s4a", { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: D(6), ease: "power3.out" }, G(300));
        tl.fromTo("#s4b", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: D(6), ease: "power4.out" }, G(314));

        tl.to(["#s4r4", "#s4r9", "#s4r22", "#s4r71"], { opacity: 0.3, duration: D(8), ease: "none" }, G(324));
        tl.to("#s4r17", { color: "#c6ff2e", duration: D(4), ease: "none" }, G(324));
        tl.to("#s4chk", { attr: { "stroke-dashoffset": 0 }, duration: D(6), ease: "power2.out" }, G(345));
        pulse("#s4r17", 347, 1.15);

        window.__timelines = window.__timelines || {};
        window.__timelines["s4-coach"] = tl;
