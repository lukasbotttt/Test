<template id="s2-stay-template">
  <!-- S2 STAYS · global 3,1–6,6 s (F93–197), lokal = global − 93. Der Torwart bleibt im Tor. -->
  <div data-composition-id="s2-stay" data-width="1080" data-height="1920" data-duration="3.5">
    <div class="scn">
      <div class="cam" id="s2cam" data-layout-allow-overflow>
        <div class="sky"></div>
        <div class="floor" style="top:1280px;height:640px;border-top:8px solid #ff1744;box-shadow:0 -6px 30px rgba(255,23,68,0.6)"></div>
        <svg id="s2net" class="net" style="left:160px;top:760px;width:760px;height:520px" viewBox="0 0 760 520" data-layout-ignore>
          <defs><pattern id="s2mesh" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <path d="M0 0 L0 34 M0 0 L34 0" stroke="#dfe9f5" stroke-opacity="0.4" stroke-width="3" fill="none"/></pattern></defs>
          <rect x="30" y="30" width="700" height="467" fill="#050912"/>
          <rect x="30" y="30" width="700" height="467" fill="url(#s2mesh)"/>
          <path d="M30 497 L30 30 L730 30 L730 497" fill="none" stroke="#ff1744" stroke-width="26" stroke-linejoin="round"/>
        </svg>
        <div id="s2ring" class="ring" data-layout-ignore style="left:415px;top:1045px;width:250px;height:250px;border-color:#ff1744;box-shadow:0 0 30px #ff1744, inset 0 0 20px #ff1744"></div>
        <div id="s2lock" class="ring" data-layout-ignore style="left:415px;top:1045px;width:250px;height:250px;border-color:#c6ff2e;box-shadow:0 0 30px #c6ff2e, inset 0 0 20px #c6ff2e"></div>
        <div id="s2g" class="chip g" data-layout-allow-overlap style="left:440px;top:1070px;width:200px;height:200px;font-size:96px;line-height:184px;">G</div>
        <div class="vig" data-layout-ignore></div>
      </div>
      <div id="s2a" class="t cyan" style="top:150px;font-size:150px;opacity:0">GOALIE</div>
      <div id="s2b" class="t lime" style="top:320px;font-size:160px;opacity:0">STAYS IN NET</div>
      <div id="s2flash" class="flash"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      @font-face { font-family: "JBMono"; src: url("fonts/JBMono700.ttf"); }
      [data-composition-id="s2-stay"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #02040c; }
      [data-composition-id="s2-stay"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s2-stay"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%); }
      [data-composition-id="s2-stay"] .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      [data-composition-id="s2-stay"] .t { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap;
        font-family: "Anton", sans-serif; line-height: 1; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s2-stay"] .lime { color: #c6ff2e; text-shadow: 0 0 22px rgba(198,255,46,0.85), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s2-stay"] .cyan { color: #00f0ff; text-shadow: 0 0 22px rgba(0,240,255,0.85), 0 10px 40px rgba(0,0,0,0.9); }
      @font-face { font-family: "DSEG7"; src: url("fonts/DSEG7Classic-Bold.woff2") format("woff2"); }
      [data-composition-id="s2-stay"] .pen { position: absolute; border-radius: 26px; background: linear-gradient(180deg, #14161b 0%, #07080a 100%);
        border: 5px solid #2b2f37; box-shadow: inset 0 0 40px rgba(0,0,0,0.9), 0 25px 60px rgba(0,0,0,0.85), 0 0 50px rgba(255,60,40,0.18); }
      [data-composition-id="s2-stay"] .pl { position: absolute; left: 0; top: 20px; width: 100%; text-align: center; font-family: "JBMono", monospace; font-size: 34px;
        letter-spacing: 10px; color: #ff5a46; text-shadow: 0 0 12px rgba(255,60,40,0.8); }
      [data-composition-id="s2-stay"] .pc { position: absolute; left: 0; bottom: 16px; width: 100%; text-align: center; font-family: "DSEG7", monospace; line-height: 1; }
      [data-composition-id="s2-stay"] .pc .gh { position: absolute; left: 0; width: 100%; color: #2a1206; }
      [data-composition-id="s2-stay"] .pc .v { position: relative; display: inline-block; color: #ffb030; text-shadow: 0 0 14px rgba(255,150,30,0.95), 0 0 40px rgba(255,110,20,0.55); }
      [data-composition-id="s2-stay"] .sky { position: absolute; inset: 0;
        background: radial-gradient(ellipse 80% 45% at 50% 58%, rgba(0,140,255,0.22), rgba(0,0,0,0) 70%), #03050b; }
      [data-composition-id="s2-stay"] .booth { position: absolute; filter: drop-shadow(0 0 14px rgba(0,200,255,0.35)); }
      [data-composition-id="s2-stay"] .btxt { font-family: "JBMono", monospace; font-size: 40px; letter-spacing: 8px; fill: #ff5a46; }
      [data-composition-id="s2-stay"] .net { position: absolute; filter: drop-shadow(0 0 18px rgba(255,23,68,0.6)); }
      [data-composition-id="s2-stay"] .chip { position: absolute; border-radius: 50%; border: 8px solid #ffffff; font-family: "Anton", sans-serif; text-align: center; color: #fff;
        background: radial-gradient(circle at 35% 30%, #4aa3ff 0%, #1257c4 70%); box-shadow: 0 0 30px rgba(0,150,255,0.9), 0 18px 30px rgba(0,0,0,0.6); }
      [data-composition-id="s2-stay"] .chip.g { background: radial-gradient(circle at 35% 30%, #ffffff 0%, #c9d6e6 75%); color: #0b3a80; border-color: #ffb030;
        box-shadow: 0 0 34px rgba(255,176,48,0.95), 0 18px 30px rgba(0,0,0,0.6); }
      [data-composition-id="s2-stay"] .ring { position: absolute; border-radius: 50%; border: 10px solid #ff1744; opacity: 0; }
      [data-composition-id="s2-stay"] .floor { position: absolute; left: 0; width: 1080px; background: linear-gradient(180deg, #0d2547 0%, #071426 100%); }
      [data-composition-id="s2-stay"] .amber { color: #ffb030; text-shadow: 0 0 22px rgba(255,150,30,0.8), 0 10px 40px rgba(0,0,0,0.9); }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 93;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const pulse = (el, f, s) => { tl.set(el, { scale: s }, G(f)); tl.to(el, { scale: 1, duration: D(9), ease: "power2.out" }, G(f)); };

        tl.fromTo("#s2cam", { scale: 1.06 }, { scale: 1, duration: D(100), ease: "power1.out" }, G(93));
        tl.fromTo("#s2a", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: D(6), ease: "power4.out" }, G(105));
        // F130 "penalty": roter Ring + Pfiff; F134 er will Richtung Strafbank (rechts raus), F150 federt zurück ins Tor
        tl.set("#s2ring", { opacity: 1, scale: 0.85 }, G(128)); tl.to("#s2ring", { opacity: 0, scale: 1.5, duration: D(14), ease: "power2.out" }, G(128));
        tl.to("#s2g", { x: 260, rotation: 25, duration: D(10), ease: "power2.in" }, G(134));
        tl.to("#s2g", { x: 0, rotation: 0, duration: D(20), ease: "elastic.out(1, 0.45)" }, G(146));
        tl.fromTo("#s2b", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: D(6), ease: "power4.out" }, G(154));
        // F181 (nach "net"): grüner Schloss-Ring rastet ein
        tl.fromTo("#s2lock", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: D(6), ease: "power3.in" }, G(175));
        pulse("#s2g", 181, 1.12);
        shake("#s2cam", 181, 5, 10, 21);

        window.__timelines = window.__timelines || {};
        window.__timelines["s2-stay"] = tl;
      })();
    </script>
  </div>
</template>
