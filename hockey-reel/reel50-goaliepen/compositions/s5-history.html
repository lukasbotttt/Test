    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 354;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const pulse = (el, f, s) => { tl.set(el, { scale: s }, G(f)); tl.to(el, { scale: 1, duration: D(9), ease: "power2.out" }, G(f)); };

        tl.fromTo("#s5cam", { scale: 1.06 }, { scale: 1, duration: D(206), ease: "power1.out" }, G(363));
        // alter Film: Flackern + Kratzer
        (function () { const r = rng(1932);
          for (let f = 363; f < 570; f += 2) { tl.set("#s5flick", { opacity: r() * 0.9 }, G(f));
            if (f % 6 === 1) { tl.set("#s5sc1", { x: r() * 1080, opacity: r() < 0.5 ? 0.6 : 0 }, G(f)); tl.set("#s5sc2", { x: r() * 1080, opacity: r() < 0.3 ? 0.5 : 0 }, G(f)); } } })();
        tl.fromTo("#s5a", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: D(7), ease: "power4.out" }, G(372));
        // F440 "sit": der Torwart fährt selbst in die Strafbank (F440–456)
        pulse("#s5g", 420, 1.2);
        tl.to("#s5g", { y: -675, duration: D(16), ease: "power3.inOut" }, G(440));
        shake("#s5cam", 457, 6, 12, 51);
        // F492 "skater": Text wechselt, Nr. 4 rutscht ohne Ausrüstung ins Tor und zittert
        tl.to("#s5a", { opacity: 0, y: -50, duration: D(5), ease: "power2.in" }, G(487));
        tl.fromTo("#s5b", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: D(6), ease: "power4.out" }, G(492));
        tl.fromTo("#s5c4", { opacity: 1, x: -700 }, { opacity: 1, x: 0, duration: D(12), ease: "expo.out" }, G(494));
        (function () { const r = rng(4);
          for (let f = 510; f < 568; f += 2) tl.set("#s5c4", { x: (r() * 2 - 1) * 9, rotation: (r() * 2 - 1) * 6 }, G(f)); })();

        window.__timelines = window.__timelines || {};
        window.__timelines["s5-history"] = tl;
