<template id="s3-fourfour-template">
  <!-- S3 4-ON-4 · global 6,3–12,2 s (F189–365), lokal = global − 189. Früher 4 gegen 4: nur 44 % endeten in der Verlängerung. -->
  <div data-composition-id="s3-fourfour" data-width="1080" data-height="1920" data-duration="5.9">
    <div class="scn">
      <div class="cam" id="s3cam" data-layout-allow-overflow>
        <div class="sky"></div>
        <div class="rinkwrap" data-layout-allow-overflow>
          <div id="s3rinkcam" class="rinkcam" data-layout-allow-overflow>
            <div id="s3plane" class="plane" data-layout-allow-overflow></div>
          </div>
        </div>
        <div class="vig" data-layout-ignore></div>
      </div>
      <div id="s3ff" class="ff">4-ON-4</div>
      <div id="s3pct" class="pct"><span class="only">ONLY</span> <span id="s3num">0%</span></div>
      <div id="s3ended" class="ended">ENDED IN OVERTIME</div>
      <div id="s3flash" class="flash"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      [data-composition-id="s3-fourfour"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #02040c; }
      [data-composition-id="s3-fourfour"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s3-fourfour"] .sky { position: absolute; inset: 0;
        background: radial-gradient(ellipse 80% 40% at 50% 70%, rgba(0,140,255,0.25), rgba(0,0,0,0) 70%), #02040c; }
      [data-composition-id="s3-fourfour"] .rinkwrap { position: absolute; left: 0; top: 380px; width: 1080px; height: 1540px; overflow: hidden; }
      [data-composition-id="s3-fourfour"] .rinkcam { position: absolute; left: 0; top: 0; width: 1080px; height: 1280px;
        perspective: 2400px; perspective-origin: 50% 100%; transform-origin: 50% 55%; }
      [data-composition-id="s3-fourfour"] .plane { position: absolute; left: 110px; top: -720px; width: 860px; height: 2021px;
        transform-origin: 50% 100%; transform: rotateX(44deg); }
      [data-composition-id="s3-fourfour"] .plane svg { position: absolute; left: 0; top: 0; filter: drop-shadow(0 0 10px rgba(0,240,255,0.7)); }
      [data-composition-id="s3-fourfour"] .chip { position: absolute; width: 84px; height: 84px; border-radius: 50%; border: 6px solid #ffffff;
        font-family: "Anton", sans-serif; font-size: 40px; line-height: 72px; text-align: center; color: #fff; }
      [data-composition-id="s3-fourfour"] .chip.h { background: #ff1744; box-shadow: 0 0 26px rgba(255,23,68,0.95); }
      [data-composition-id="s3-fourfour"] .chip.a { background: #0095ff; box-shadow: 0 0 26px rgba(0,180,255,0.95); }
      [data-composition-id="s3-fourfour"] .puck { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: #0a0a0f;
        border: 4px solid #e8f6ff; box-shadow: 0 0 14px rgba(255,255,255,0.8); }
      [data-composition-id="s3-fourfour"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%); }
      [data-composition-id="s3-fourfour"] .ff { position: absolute; left: 0; top: 130px; width: 1080px; text-align: center; opacity: 0;
        font-family: "Anton", sans-serif; font-size: 130px; line-height: 1; color: #00f0ff; text-shadow: 0 0 22px rgba(0,240,255,0.85), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s3-fourfour"] .pct { position: absolute; left: 0; top: 270px; width: 1080px; text-align: center; white-space: nowrap; opacity: 0;
        font-family: "Anton", sans-serif; font-size: 240px; line-height: 1; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s3-fourfour"] .pct .only { font-size: 110px; color: #c9d3e0; }
      [data-composition-id="s3-fourfour"] .ended { position: absolute; left: 0; top: 530px; width: 1080px; text-align: center; opacity: 0;
        font-family: "Anton", sans-serif; font-size: 84px; line-height: 1; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s3-fourfour"] .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 189;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };

        // Eisfläche (Draufsicht, NHL-Maße 200 x 85 ft; Einheiten 760 x 1786, gezeichnet in 860 x 2021 px)
        const K = 860 / 760, plane = document.querySelector("#s3plane");
        plane.innerHTML = '<svg width="860" height="2021" viewBox="0 0 760 1786"><defs><linearGradient id="s3ice" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="#0a1a33"/><stop offset="1" stop-color="#0d2547"/></linearGradient></defs>' +
          '<rect x="6" y="6" width="748" height="1774" rx="250" fill="url(#s3ice)" stroke="#00f0ff" stroke-width="10"/>' +
          '<g fill="none"><line x1="6" y1="893" x2="754" y2="893" stroke="#ff1744" stroke-width="12"/>' +
          '<line x1="6" y1="670" x2="754" y2="670" stroke="#2f7bff" stroke-width="12"/><line x1="6" y1="1116" x2="754" y2="1116" stroke="#2f7bff" stroke-width="12"/>' +
          '<line x1="40" y1="98" x2="720" y2="98" stroke="#ff1744" stroke-width="4"/><line x1="40" y1="1688" x2="720" y2="1688" stroke="#ff1744" stroke-width="4"/>' +
          '<circle cx="380" cy="893" r="134" stroke="#2f7bff" stroke-width="5"/>' +
          '<circle cx="184" cy="277" r="134" stroke="#ff1744" stroke-width="5"/><circle cx="576" cy="277" r="134" stroke="#ff1744" stroke-width="5"/>' +
          '<circle cx="184" cy="1509" r="134" stroke="#ff1744" stroke-width="5"/><circle cx="576" cy="1509" r="134" stroke="#ff1744" stroke-width="5"/></g>' +
          '<path d="M326 98 A54 54 0 0 0 434 98 Z" fill="rgba(0,160,255,0.35)"/><path d="M326 1688 A54 54 0 0 1 434 1688 Z" fill="rgba(0,160,255,0.35)"/>' +
          '<rect x="353" y="60" width="54" height="38" fill="none" stroke="#ffffff" stroke-width="4"/><rect x="353" y="1688" width="54" height="38" fill="none" stroke="#ffffff" stroke-width="4"/>' +
          '<g fill="#ff1744"><circle cx="184" cy="715" r="9"/><circle cx="576" cy="715" r="9"/><circle cx="184" cy="1071" r="9"/><circle cx="576" cy="1071" r="9"/></g></svg>';
        const chip = (cls, num, x, y) => { const d = document.createElement("div"); d.className = "chip " + cls; d.textContent = num;
          d.style.left = Math.round(x * K - 42) + "px"; d.style.top = Math.round(y * K - 42) + "px"; plane.appendChild(d); return d; };
        // 4 gegen 4 – eng beieinander in der Mitte, jeder Chip zappelt um seinen Platz (wenig Raum)
        const players = [["h", 9, 360, 1010], ["h", 27, 520, 960], ["h", 44, 250, 900], ["h", 3, 430, 1160],
                         ["a", 8, 330, 820], ["a", 19, 480, 860], ["a", 71, 220, 1040], ["a", 5, 560, 1080]];
        players.forEach(([cls, num, x, y], i) => {
          const d = chip(cls, num, x, y), r = rng(300 + i);
          for (let f = 189; f < 366; f += 30) {
            tl.to(d, { x: (r() * 2 - 1) * 70 * K, y: (r() * 2 - 1) * 70 * K, duration: D(30), ease: "sine.inOut" }, G(f));
          }
        });
        tl.fromTo("#s3rinkcam", { scale: 1.1, y: 40 }, { scale: 1.18, y: 0, duration: D(177), ease: "none" }, G(189));

        // F197 "4-ON-4" (auf "four-on-four"), F240–249 Zähler 0 -> 44 % (auf "forty-four"), dazu "ENDED IN OVERTIME"
        tl.fromTo("#s3ff", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: D(6), ease: "power3.out" }, G(197));
        tl.fromTo("#s3pct", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: D(6), ease: "power4.out" }, G(238));
        for (let f = 240; f <= 249; f++) tl.set("#s3num", { textContent: Math.round(44 * (f - 239) / 10) + "%" }, G(f));
        tl.fromTo("#s3ended", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: D(6), ease: "power2.out" }, G(250));
        tl.set("#s3flash", { opacity: 0.2 }, G(249));
        tl.to("#s3flash", { opacity: 0, duration: D(5), ease: "power2.in" }, G(249));
        shake("#s3cam", 249, 5, 12, 31);
        [270, 300, 330].forEach((f) => {
          tl.set("#s3pct", { scale: 1.03 }, G(f));
          tl.to("#s3pct", { scale: 1, duration: D(8), ease: "power2.out" }, G(f));
        });

        window.__timelines = window.__timelines || {};
        window.__timelines["s3-fourfour"] = tl;
      })();
    </script>
  </div>
</template>
