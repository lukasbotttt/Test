<template id="s4-fix-template">
  <!-- S4 FIX · global 10,8–14,7 s (F324–440), lokal = global − 324. 1910-11: drei Drittel à 20 Minuten. -->
  <div data-composition-id="s4-fix" data-width="1080" data-height="1920" data-duration="3.9">
    <div class="scn">
      <div class="cam" id="s4cam" data-layout-allow-overflow>
        <div class="sky"></div>
        <div id="s4spotL" class="spot" style="left:60px" data-layout-ignore></div>
        <div id="s4spotR" class="spot" style="left:600px" data-layout-ignore></div>
        <div id="s4board" class="board"><div class="bhead">PERIOD</div><div id="s4clock" class="clock">20:00</div><div class="lamps"><div class="lamp" id="s4l1">1</div><div class="lamp" id="s4l2">2</div><div class="lamp" id="s4l3">3</div></div></div>
        <div class="vig" data-layout-ignore></div>
      </div>
      <div id="s4a" class="t cyan" style="top:160px;font-size:110px;opacity:0">1910-11</div>
      <div id="s4b" class="t" style="top:310px;font-size:230px;opacity:0"><span class="lime">3</span> × 20 MIN</div>
      <div id="s4flash" class="flash"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      @font-face { font-family: "JBMono"; src: url("fonts/JBMono700.ttf"); }
      [data-composition-id="s4-fix"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #02040c; }
      [data-composition-id="s4-fix"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s4-fix"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%); }
      [data-composition-id="s4-fix"] .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      [data-composition-id="s4-fix"] .t { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap;
        font-family: "Anton", sans-serif; line-height: 1; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s4-fix"] .lime { color: #c6ff2e; text-shadow: 0 0 22px rgba(198,255,46,0.85), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s4-fix"] .cyan { color: #00f0ff; text-shadow: 0 0 22px rgba(0,240,255,0.85), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s4-fix"] .sky { position: absolute; inset: 0;
        background: radial-gradient(ellipse 70% 40% at 50% 62%, rgba(0,160,255,0.28), rgba(0,0,0,0) 70%),
                    radial-gradient(ellipse 50% 30% at 50% 18%, rgba(198,255,46,0.10), rgba(0,0,0,0) 70%), #02040c; }
      [data-composition-id="s4-fix"] .spot { position: absolute; top: -200px; width: 420px; height: 1500px; transform-origin: 50% 0%;
        background: linear-gradient(180deg, rgba(200,240,255,0.22) 0%, rgba(200,240,255,0) 85%); filter: blur(10px); }
      [data-composition-id="s4-fix"] .board { position: absolute; left: 140px; top: 860px; width: 800px; height: 600px; border-radius: 44px;
        background: linear-gradient(180deg, #0b0f18 0%, #05070c 100%); border: 6px solid #1f2b3d;
        box-shadow: 0 0 0 3px rgba(0,240,255,0.35), 0 0 60px rgba(0,240,255,0.35), 0 40px 80px rgba(0,0,0,0.85); }
      [data-composition-id="s4-fix"] .bhead { position: absolute; left: 0; top: 40px; width: 788px; text-align: center; font-family: "JBMono", monospace;
        font-size: 48px; letter-spacing: 14px; color: #00f0ff; text-shadow: 0 0 14px rgba(0,240,255,0.8); }
      [data-composition-id="s4-fix"] .clock { position: absolute; left: 0; top: 110px; width: 788px; text-align: center; font-family: "JBMono", monospace;
        font-size: 190px; line-height: 1.1; color: #ffb020; text-shadow: 0 0 22px rgba(255,176,32,0.85); }
      [data-composition-id="s4-fix"] .lamps { position: absolute; left: 0; top: 380px; width: 788px; display: flex; justify-content: center; gap: 46px; }
      [data-composition-id="s4-fix"] .lamp { width: 150px; height: 150px; border-radius: 50%; background: #121722; border: 6px solid #2a3344;
        font-family: "Anton", sans-serif; font-size: 96px; line-height: 138px; text-align: center; color: #5b6474; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 324;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const pulse = (el, f, s) => { tl.set(el, { scale: s }, G(f)); tl.to(el, { scale: 1, duration: D(9), ease: "power2.out" }, G(f)); };

        tl.fromTo("#s4cam", { scale: 1.06 }, { scale: 1, duration: D(111), ease: "power1.out" }, G(330));
        tl.fromTo("#s4spotL", { rotation: -14 }, { rotation: 12, duration: D(117), ease: "sine.inOut" }, G(324));
        tl.fromTo("#s4spotR", { rotation: 14 }, { rotation: -12, duration: D(117), ease: "sine.inOut" }, G(324));
        ["19:59", "19:58", "19:57"].forEach((t, i) => tl.set("#s4clock", { textContent: t }, G(360 + i * 30)));
        // F336 "1910-11", Lampen 1-2-3 auf F360/368/376, F370 "3 × 20 MIN" (auf "three periods"), Puls auf "twenty minutes" (F398)
        tl.fromTo("#s4a", { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: D(6), ease: "power3.out" }, G(336));
        [360, 368, 376].forEach((f, i) => { tl.to("#s4l" + (i + 1), { ...{ backgroundColor: "#c6ff2e", borderColor: "#f4ffd0", color: "#0b1000", boxShadow: "0 0 40px rgba(198,255,46,0.95)" }, duration: D(3), ease: "none" }, G(f)); pulse("#s4l" + (i + 1), f, 1.18); });
        tl.fromTo("#s4b", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: D(6), ease: "power4.out" }, G(369));
        shake("#s4cam", 375, 5, 12, 41);
        pulse("#s4b", 398, 1.05);
        tl.set("#s4flash", { opacity: 0.18 }, G(398));
        tl.to("#s4flash", { opacity: 0, duration: D(5), ease: "power2.in" }, G(398));

        window.__timelines = window.__timelines || {};
        window.__timelines["s4-fix"] = tl;
      })();
    </script>
  </div>
</template>
