<template id="s1-hook-template">
  <!-- S1 HOOK · global 0–3,2 s (F0–95), lokal = global. Frage ab Bild 0, Anzeigetafel mit Drittel-Lampen 1-2-3. -->
  <div data-composition-id="s1-hook" data-width="1080" data-height="1920" data-duration="3.2">
    <div class="scn">
      <div class="cam" id="s1cam" data-layout-allow-overflow>
        <div class="sky"></div>
        <div id="s1spotL" class="spot" style="left:60px" data-layout-ignore></div>
        <div id="s1spotR" class="spot" style="left:600px" data-layout-ignore></div>
        <div id="s1board" class="board"><div class="bhead">PERIOD</div><div id="s1clock" class="clock">20:00</div><div class="lamps"><div class="lamp" id="s1l1">1</div><div class="lamp" id="s1l2">2</div><div class="lamp" id="s1l3">3</div></div></div>
        <div class="vig" data-layout-ignore></div>
      </div>
      <div id="s1a" class="t" style="top:150px;font-size:124px">WHY DOES HOCKEY</div>
      <div id="s1b" class="t" style="top:300px;font-size:150px">HAVE <span class="lime">3 PERIODS?</span></div>
      <div id="s1flash" class="flash"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      @font-face { font-family: "JBMono"; src: url("fonts/JBMono700.ttf"); }
      [data-composition-id="s1-hook"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #02040c; }
      [data-composition-id="s1-hook"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s1-hook"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%); }
      [data-composition-id="s1-hook"] .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      [data-composition-id="s1-hook"] .t { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap;
        font-family: "Anton", sans-serif; line-height: 1; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s1-hook"] .lime { color: #c6ff2e; text-shadow: 0 0 22px rgba(198,255,46,0.85), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s1-hook"] .cyan { color: #00f0ff; text-shadow: 0 0 22px rgba(0,240,255,0.85), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s1-hook"] .sky { position: absolute; inset: 0;
        background: radial-gradient(ellipse 70% 40% at 50% 62%, rgba(0,160,255,0.28), rgba(0,0,0,0) 70%),
                    radial-gradient(ellipse 50% 30% at 50% 18%, rgba(198,255,46,0.10), rgba(0,0,0,0) 70%), #02040c; }
      [data-composition-id="s1-hook"] .spot { position: absolute; top: -200px; width: 420px; height: 1500px; transform-origin: 50% 0%;
        background: linear-gradient(180deg, rgba(200,240,255,0.22) 0%, rgba(200,240,255,0) 85%); filter: blur(10px); }
      [data-composition-id="s1-hook"] .board { position: absolute; left: 140px; top: 860px; width: 800px; height: 600px; border-radius: 44px;
        background: linear-gradient(180deg, #0b0f18 0%, #05070c 100%); border: 6px solid #1f2b3d;
        box-shadow: 0 0 0 3px rgba(0,240,255,0.35), 0 0 60px rgba(0,240,255,0.35), 0 40px 80px rgba(0,0,0,0.85); }
      [data-composition-id="s1-hook"] .bhead { position: absolute; left: 0; top: 40px; width: 788px; text-align: center; font-family: "JBMono", monospace;
        font-size: 48px; letter-spacing: 14px; color: #00f0ff; text-shadow: 0 0 14px rgba(0,240,255,0.8); }
      [data-composition-id="s1-hook"] .clock { position: absolute; left: 0; top: 110px; width: 788px; text-align: center; font-family: "JBMono", monospace;
        font-size: 190px; line-height: 1.1; color: #ffb020; text-shadow: 0 0 22px rgba(255,176,32,0.85); }
      [data-composition-id="s1-hook"] .lamps { position: absolute; left: 0; top: 380px; width: 788px; display: flex; justify-content: center; gap: 46px; }
      [data-composition-id="s1-hook"] .lamp { width: 150px; height: 150px; border-radius: 50%; background: #121722; border: 6px solid #2a3344;
        font-family: "Anton", sans-serif; font-size: 96px; line-height: 138px; text-align: center; color: #5b6474; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 0;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const pulse = (el, f, s) => { tl.set(el, { scale: s }, G(f)); tl.to(el, { scale: 1, duration: D(9), ease: "power2.out" }, G(f)); };

        // F0: Frage steht ab Bild 0, Anzeigetafel schlägt aus Kamerarichtung ein, Spots schwenken
        tl.fromTo(["#s1a", "#s1b"], { scale: 1.05 }, { scale: 1, duration: D(6), ease: "power3.out" }, G(0));
        tl.fromTo("#s1board", { scale: 1.5, y: 260 }, { scale: 1, y: 0, duration: D(7), ease: "power3.in" }, G(0));
        shake("#s1cam", 7, 6, 18, 11);
        tl.fromTo("#s1cam", { scale: 1 }, { scale: 1.05, duration: D(96), ease: "none" }, G(7));
        tl.fromTo("#s1spotL", { rotation: -18 }, { rotation: 10, duration: D(96), ease: "sine.inOut" }, G(0));
        tl.fromTo("#s1spotR", { rotation: 18 }, { rotation: -10, duration: D(96), ease: "sine.inOut" }, G(0));
        // Uhr läuft in Echtzeit, Drittel-Lampen 1-2-3 auf F9/F19/F29 (F29 = gesprochenes "three")
        ["19:59", "19:58", "19:57"].forEach((t, i) => tl.set("#s1clock", { textContent: t }, G(30 + i * 30)));
        [9, 19, 29].forEach((f, i) => { tl.to("#s1l" + (i + 1), { ...{ backgroundColor: "#c6ff2e", borderColor: "#f4ffd0", color: "#0b1000", boxShadow: "0 0 40px rgba(198,255,46,0.95)" }, duration: D(3), ease: "none" }, G(f)); pulse("#s1l" + (i + 1), f, 1.18); });
        pulse("#s1b", 29, 1.07);
        tl.set("#s1flash", { opacity: 0.22 }, G(29));
        tl.to("#s1flash", { opacity: 0, duration: D(5), ease: "power2.in" }, G(29));
        [45, 60, 75].forEach((f) => pulse("#s1l3", f, 1.08));

        window.__timelines = window.__timelines || {};
        window.__timelines["s1-hook"] = tl;
      })();
    </script>
  </div>
</template>
