    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 999;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const pulse = (el, f, s) => { tl.set(el, { scale: s }, G(f)); tl.to(el, { scale: 1, duration: D(10), ease: "power2.out" }, G(f)); };
        // Kino-Titel: aus Unschärfe + weiter Laufweite scharf zusammenziehen
        // (ls0/ls1 = Laufweiten-Gefühl: weite Laufweite -> stärkeres Zusammenziehen über scaleX, ohne Layout-Animation)
        const reveal = (el, f, n, ls0, ls1) => tl.fromTo(el, { opacity: 0, filter: "blur(14px)", scaleX: 1 + (ls0 - ls1) / 140, scaleY: 1.04 },
          { opacity: 1, filter: "blur(0px)", scaleX: 1, scaleY: 1, duration: D(n || 18), ease: "power3.out" }, G(f));
        const hide = (el, f, n) => tl.to(el, { opacity: 0, filter: "blur(10px)", duration: D(n || 8), ease: "power2.in" }, G(f));
        // Staub im Lichtkegel
        const dust = (sel, seed, n, f0, f1, x0, x1, y0, y1) => { const box = document.querySelector(sel), r = rng(seed);
          for (let i = 0; i < n; i++) { const d = document.createElement("div"); d.className = "dust"; const s = 2 + r() * 5;
            d.style.width = s + "px"; d.style.height = s + "px"; d.style.left = Math.round(x0 + r() * (x1 - x0)) + "px";
            d.style.top = Math.round(y0 + r() * (y1 - y0)) + "px"; d.style.opacity = (0.25 + r() * 0.6).toFixed(2); box.appendChild(d);
            tl.fromTo(d, { x: 0, y: 0 }, { x: (r() * 2 - 1) * 60, y: -40 - r() * 120, duration: D(f1 - f0), ease: "none" }, G(f0)); } };

        (function () { const box = document.querySelector("#s6sparks"), r = rng(81);
          for (let i = 0; i < 70; i++) { const d = document.createElement("div"); d.className = "sp";
            d.style.left = Math.round(r() * 1080) + "px"; d.style.top = Math.round(400 + r() * 1400) + "px"; d.style.opacity = (0.3 + r() * 0.7).toFixed(2); box.appendChild(d);
            tl.fromTo(d, { y: 0, x: 0 }, { y: -500 - r() * 600, x: (r() * 2 - 1) * 120, duration: D(180), ease: "none" }, G(1002)); } })();
        tl.fromTo("#s6rays", { opacity: 0, rotation: 0 }, { opacity: 1, rotation: 25, duration: D(180), ease: "none" }, G(1002));
        tl.fromTo("#s6cam", { scale: 1.08 }, { scale: 1.0, duration: D(180), ease: "power1.out" }, G(1002));
        // F1020 "THE", F1043 "MIRACLE" (auf "miracle"), F1050 "ON ICE", Glanz, F1060 Ergebnis
        reveal("#s6the", 1022, 18, 40, 22);
        reveal("#s6m1", 1040, 22, 40, 4);
        reveal("#s6m2", 1050, 22, 40, 4);
        tl.fromTo("#s6sw", { opacity: 0, x: 0 }, { opacity: 1, x: 1600, duration: D(30), ease: "power2.inOut" }, G(1064));
        reveal("#s6sc", 1062, 16, 24, 10);
        // F1095 (auf "Two days later"): Titelblock rückt nach oben, Medaille fällt, Gold-Zeilen
        tl.to("#s6t", { y: -240, scale: 0.8, duration: D(18), ease: "power3.inOut" }, G(1093));
        tl.to("#s6sw", { y: -240, duration: D(1), ease: "none" }, G(1094));
        tl.fromTo("#s6medal", { opacity: 0, y: -500, rotation: -10 }, { opacity: 1, y: 0, rotation: 0, duration: D(12), ease: "bounce.out" }, G(1100));
        reveal("#s6g1", 1110, 16, 20, 6);
        reveal("#s6g2", 1137, 18, 30, 4);

        window.__timelines = window.__timelines || {};
        window.__timelines["s6-title"] = tl;
      })();
    </script>
