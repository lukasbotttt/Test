<template id="s3-kids-template">
  <!-- S3 COLLEGE KIDS · global 8,6–11,3 s (F258–338), sichtbar ab F261. Amateure / College-Spieler. -->
  <div data-composition-id="s3-kids" data-width="1080" data-height="1920" data-duration="2.7">
    <div class="scn">
      <div class="cam" id="s3cam" data-layout-allow-overflow>
        <div class="bg"></div>
        <div id="s3beam" class="beam" style="left:190px" data-layout-ignore></div>
        <div id="s3dust" class="dustbox" data-layout-ignore></div>
        <div id="s3grid" class="grid"></div>
        <div class="vig" data-layout-ignore></div>
      </div>
      <div id="s3a" class="c" style="top:400px;font-size:92px;opacity:0">THE AMERICANS?</div>
      <div id="s3b" class="c" style="top:560px;font-size:112px;opacity:0">COLLEGE KIDS.</div>
      <div id="s3flash" class="flash"></div>
    </div>

    <style>
      @font-face { font-family: "Cinzel"; src: url("fonts/Cinzel.woff2") format("woff2"); font-weight: 400 900; }
      @font-face { font-family: "DSEG7"; src: url("fonts/DSEG7Classic-Bold.woff2") format("woff2"); }
      @font-face { font-family: "ArchivoX"; src: url("fonts/ArchivoX900.ttf"); }
      @font-face { font-family: "JBMono"; src: url("fonts/JBMono700.ttf"); }
      [data-composition-id="s3-kids"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      [data-composition-id="s3-kids"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s3-kids"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 60% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.85) 100%); }
      [data-composition-id="s3-kids"] .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      [data-composition-id="s3-kids"] .c { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; font-family: "Cinzel", serif; font-weight: 900;
        line-height: 1.05; color: #f6efe2; letter-spacing: 4px;
        text-shadow: 0 0 28px rgba(255,190,110,0.32), 0 6px 30px rgba(0,0,0,0.95); }
      [data-composition-id="s3-kids"] .amber { color: #ffbf5a; font-weight: 700; text-shadow: 0 0 18px rgba(255,160,40,0.55), 0 4px 20px rgba(0,0,0,0.9); }
      [data-composition-id="s3-kids"] .gold { background: linear-gradient(180deg, #fff3c4 0%, #f2c45a 45%, #b07a1c 100%); -webkit-background-clip: text; background-clip: text;
        color: transparent; text-shadow: none; filter: drop-shadow(0 0 22px rgba(255,190,80,0.45)) drop-shadow(0 6px 18px rgba(0,0,0,0.9)); }
      [data-composition-id="s3-kids"] .beam { position: absolute; top: -200px; width: 700px; height: 1700px; transform-origin: 50% 0%;
        background: linear-gradient(180deg, rgba(255,226,170,0.26) 0%, rgba(255,226,170,0.07) 55%, rgba(255,226,170,0) 85%);
        clip-path: polygon(42% 0%, 58% 0%, 100% 100%, 0% 100%); filter: blur(14px); }
      [data-composition-id="s3-kids"] .dustbox { position: absolute; inset: 0; }
      [data-composition-id="s3-kids"] .dust { position: absolute; border-radius: 50%; background: #ffe7bd; filter: blur(0.6px); }
      [data-composition-id="s3-kids"] .bg { position: absolute; inset: 0;
        background: radial-gradient(ellipse 60% 40% at 50% 60%, rgba(30,70,140,0.5), rgba(0,0,0,0) 70%), #01040b; }
      [data-composition-id="s3-kids"] .beam { background: linear-gradient(180deg, rgba(170,210,255,0.24) 0%, rgba(150,190,255,0.06) 55%, rgba(0,0,0,0) 85%); }
      [data-composition-id="s3-kids"] .grid { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s3-kids"] .kid { position: absolute; width: 74px; height: 74px; border-radius: 50%; opacity: 0;
        background: radial-gradient(circle at 35% 35%, #ffffff, #b9d4ff 45%, #2f6fd6 100%); box-shadow: 0 0 22px rgba(120,170,255,0.8); }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 258;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const pulse = (el, f, s) => { tl.set(el, { scale: s }, G(f)); tl.to(el, { scale: 1, duration: D(10), ease: "power2.out" }, G(f)); };
        // Kino-Titel: aus Unschärfe + weiter Laufweite scharf zusammenziehen
        // (ls0/ls1 = Laufweiten-Gefühl: weite Laufweite -> stärkeres Zusammenziehen über scaleX, ohne Layout-Animation)
        const reveal = (el, f, n, ls0, ls1) => tl.fromTo(el, { opacity: 0, filter: "blur(14px)", scaleX: 1 + (ls0 - ls1) / 140, scaleY: 1.04 },
          { opacity: 1, filter: "blur(0px)", scaleX: 1, scaleY: 1, duration: D(n || 18), ease: "power3.out" }, G(f));
        const hide = (el, f, n) => tl.to(el, { opacity: 0, filter: "blur(10px)", duration: D(n || 8), ease: "power2.in" }, G(f));
        // Staub im Lichtkegel
        const dust = (sel, seed, n, f0, f1, x0, x1, y0, y1) => { const box = document.querySelector(sel), r = rng(seed);
          for (let i = 0; i < n; i++) { const d = document.createElement("div"); d.className = "dust"; const s = 2 + r() * 5;
            d.style.width = s + "px"; d.style.height = s + "px"; d.style.left = Math.round(x0 + r() * (x1 - x0)) + "px";
            d.style.top = Math.round(y0 + r() * (y1 - y0)) + "px"; d.style.opacity = (0.25 + r() * 0.6).toFixed(2); box.appendChild(d);
            tl.fromTo(d, { x: 0, y: 0 }, { x: (r() * 2 - 1) * 60, y: -40 - r() * 120, duration: D(f1 - f0), ease: "none" }, G(f0)); } };

        dust("#s3dust", 31, 36, 261, 340, 260, 820, 300, 1500);
        tl.fromTo("#s3cam", { scale: 1.0 }, { scale: 1.06, duration: D(79), ease: "none" }, G(261));
        reveal("#s3a", 266, 16, 22, 4);
        reveal("#s3b", 285, 16, 26, 4);
        // 20 Spieler (Chips) erscheinen nacheinander – klein, nervös zitternd
        (function () { const box = document.querySelector("#s3grid"), r = rng(7);
          for (let i = 0; i < 20; i++) { const d = document.createElement("div"); d.className = "kid";
            const cx = 200 + (i % 5) * 170, cy = 920 + Math.floor(i / 5) * 140;
            d.style.left = (cx - 37) + "px"; d.style.top = (cy - 37) + "px"; box.appendChild(d);
            const f = 270 + i * 1.3;
            tl.fromTo(d, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: D(6), ease: "back.out(2)" }, G(f));
            for (let k = Math.ceil(f) + 8; k < 334; k += 4) tl.set(d, { x: (r() * 2 - 1) * 2.5, y: (r() * 2 - 1) * 2.5 }, G(k));
          } })();

        window.__timelines = window.__timelines || {};
        window.__timelines["s3-kids"] = tl;
      })();
    </script>
  </div>
</template>
