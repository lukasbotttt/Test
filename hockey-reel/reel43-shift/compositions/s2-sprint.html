<template id="s2-sprint-template">
  <!-- S2 SPRINT · global 4,3–12,2 s (F129–365), lokal = global − 129. Ein Gedanke pro Bild:
       F135–224 "ALL-OUT SPRINT" · F225–306 "30–40 SEC" + Akku läuft leer · F307–359 "EXHAUSTED". -->
  <div data-composition-id="s2-sprint" data-width="1080" data-height="1920" data-duration="7.9">
    <div class="scn">
      <div class="cam" id="s2cam" data-layout-allow-overflow>
        <div class="sky"></div>
        <div id="s2streaks" class="streaks"></div>
        <!-- Vordergrund (ab F225): Akku (Vektor/CSS) -->
        <div id="s2bat" class="bat">
          <div class="cap"></div>
          <div class="body"><div id="s2fill" class="fill"></div>
            <i style="top:20%"></i><i style="top:40%"></i><i style="top:60%"></i><i style="top:80%"></i></div>
        </div>
        <div id="s2red" class="red" data-layout-ignore></div>
        <div class="vig" data-layout-ignore></div>
      </div>
      <div id="s2a" class="sprintbox">
        <div id="s2allout" class="allout">ALL-OUT</div>
        <div id="s2sprint" class="big">
          <span class="lay r" aria-hidden="true" data-layout-allow-overlap>SPRINT</span><span class="lay c" aria-hidden="true" data-layout-allow-overlap>SPRINT</span><span class="lay main" data-layout-allow-overlap>SPRINT</span></div>
      </div>
      <div id="s2range" class="head range">30–40 SEC</div>
      <div id="s2ex" class="head ex">EXHAUSTED</div>
      <div id="s2flash" class="flash"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      [data-composition-id="s2-sprint"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #020611; }
      [data-composition-id="s2-sprint"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s2-sprint"] .sky { position: absolute; inset: 0;
        background: radial-gradient(ellipse 80% 40% at 50% 55%, rgba(0,200,255,0.22), rgba(0,0,0,0) 70%),
                    radial-gradient(ellipse 60% 30% at 50% 15%, rgba(255,214,0,0.10), rgba(0,0,0,0) 70%), #020611; }
      [data-composition-id="s2-sprint"] .streaks { position: absolute; inset: 0; }
      [data-composition-id="s2-sprint"] .st { position: absolute; left: 1100px; height: 6px; border-radius: 3px; }
      [data-composition-id="s2-sprint"] .bat { position: absolute; left: 360px; top: 640px; width: 360px; height: 760px; opacity: 0; }
      [data-composition-id="s2-sprint"] .cap { position: absolute; left: 115px; top: 0; width: 130px; height: 50px; border-radius: 14px 14px 0 0; background: #c9f3ff;
        box-shadow: 0 0 20px rgba(0,240,255,0.8); }
      [data-composition-id="s2-sprint"] .body { position: absolute; left: 0; top: 46px; width: 360px; height: 714px; border-radius: 42px;
        border: 14px solid #c9f3ff; background: rgba(4,10,24,0.9); overflow: hidden;
        box-shadow: 0 0 30px rgba(0,240,255,0.7), 0 30px 60px rgba(0,0,0,0.8); }
      [data-composition-id="s2-sprint"] .fill { position: absolute; left: 16px; bottom: 16px; width: 300px; height: 654px; border-radius: 20px;
        background: #c6ff2e; box-shadow: 0 0 30px rgba(198,255,46,0.9); }
      [data-composition-id="s2-sprint"] .body i { position: absolute; left: 0; width: 332px; height: 10px; background: rgba(4,10,24,0.9); }
      [data-composition-id="s2-sprint"] .red { position: absolute; inset: 0; opacity: 0;
        background: radial-gradient(ellipse at center, rgba(255,0,40,0) 35%, rgba(255,0,40,0.5) 100%); }
      [data-composition-id="s2-sprint"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%); }
      [data-composition-id="s2-sprint"] .sprintbox { position: absolute; left: 0; top: 600px; width: 1080px; height: 520px; }
      [data-composition-id="s2-sprint"] .allout { position: absolute; left: 0; top: 0; width: 1080px; text-align: center; opacity: 0;
        font-family: "Anton", sans-serif; font-size: 150px; line-height: 1; color: #00f0ff; text-shadow: 0 0 22px rgba(0,240,255,0.85), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s2-sprint"] .big { position: absolute; left: 0; top: 170px; width: 1080px; height: 320px; opacity: 0;
        font-family: "Anton", sans-serif; font-size: 300px; line-height: 1; text-align: center; }
      [data-composition-id="s2-sprint"] .lay { position: absolute; left: 0; top: 0; width: 1080px; text-align: center; }
      [data-composition-id="s2-sprint"] .lay.r { color: #ff0050; mix-blend-mode: screen; }
      [data-composition-id="s2-sprint"] .lay.c { color: #00f0ff; mix-blend-mode: screen; }
      [data-composition-id="s2-sprint"] .big .lay.main { color: #ffffff; -webkit-text-stroke: 5px #00121a; paint-order: stroke fill;
        text-shadow: 0 0 20px rgba(0,240,255,0.9), 0 0 70px rgba(0,240,255,0.55), 0 12px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s2-sprint"] .head { position: absolute; left: 0; top: 260px; width: 1080px; text-align: center; opacity: 0;
        font-family: "Anton", sans-serif; line-height: 1; }
      [data-composition-id="s2-sprint"] .range { font-size: 230px; color: #ffd600; text-shadow: 0 0 22px rgba(255,214,0,0.85), 0 12px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s2-sprint"] .ex { top: 290px; font-size: 200px; color: #ff1744; -webkit-text-stroke: 5px #14000a; paint-order: stroke fill;
        text-shadow: 0 0 20px rgba(255,23,68,0.95), 0 0 70px rgba(255,23,68,0.6), 0 12px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s2-sprint"] .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 129;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const split = (sel, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const a = amp * (0.4 + 0.6 * r());
            tl.set(sel + " .r", { x: -a, y: (r() - 0.5) * 6 }, G(f0 + i)); tl.set(sel + " .c", { x: a, y: (r() - 0.5) * 6 }, G(f0 + i)); }
          tl.set([sel + " .r", sel + " .c"], { x: 0, y: 0 }, G(f0 + n)); };

        // Speed-Streifen (Hintergrund): rasen nach links, werden zum Ende des Akkus hin schneller
        (function () { const box = document.querySelector("#s2streaks"), r = rng(5);
          const cols = ["rgba(0,240,255,0.5)", "rgba(255,255,255,0.3)", "rgba(255,214,0,0.35)", "rgba(0,140,255,0.45)"];
          for (let i = 0; i < 26; i++) {
            const d = document.createElement("div"); d.className = "st";
            const w = 160 + r() * 520; d.style.width = w + "px"; d.style.top = Math.round(r() * 1920) + "px";
            d.style.background = cols[i % 4]; d.style.opacity = (0.3 + r() * 0.6).toFixed(2);
            box.appendChild(d);
            let f = 129 + Math.floor(r() * 14);
            while (f < 366) { const dur = Math.max(5, Math.round((14 + r() * 10) * (1 - 0.5 * Math.min(1, (f - 129) / 180))));
              tl.fromTo(d, { x: 0 }, { x: -1100 - w - 40, duration: D(dur), ease: "none" }, G(f)); f += dur; }
          } })();

        // Bild 1 (F135–224): ALL-OUT SPRINT steht sofort, Puls auf das gesprochene "sprint" (F188)
        tl.fromTo("#s2allout", { opacity: 0, y: -80 }, { opacity: 1, y: 0, duration: D(6), ease: "power3.out" }, G(136));
        tl.fromTo("#s2sprint", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: D(6), ease: "power4.out" }, G(139));
        split("#s2sprint", 145, 5, 14, 41);
        tl.set("#s2sprint", { scale: 1.1 }, G(188));
        tl.to("#s2sprint", { scale: 1, duration: D(10), ease: "power3.out" }, G(188));
        split("#s2sprint", 188, 5, 16, 46);
        shake("#s2cam", 188, 6, 18, 42);
        tl.set("#s2flash", { opacity: 0.3 }, G(188));
        tl.to("#s2flash", { opacity: 0, duration: D(5), ease: "power2.in" }, G(188));

        // Bild 2 (F225–306): SPRINT raus, "30–40 SEC" oben, Akku fährt hoch und läuft leer (F231 -> F307)
        tl.to("#s2a", { y: -300, opacity: 0, duration: D(6), ease: "power3.in" }, G(222));
        tl.fromTo("#s2range", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: D(6), ease: "power4.out" }, G(227));
        tl.fromTo("#s2bat", { opacity: 0, y: 700 }, { opacity: 1, y: 0, duration: D(12), ease: "expo.out" }, G(225));
        tl.fromTo("#s2fill", { height: 654 }, { height: 8, duration: D(76), ease: "power1.in" }, G(231));
        tl.to("#s2fill", { backgroundColor: "#ffd600", boxShadow: "0 0 30px rgba(255,214,0,0.9)", duration: D(24), ease: "none" }, G(250));
        tl.to("#s2fill", { backgroundColor: "#ff1744", boxShadow: "0 0 30px rgba(255,23,68,0.95)", duration: D(24), ease: "none" }, G(280));
        [240, 255, 270, 285].forEach((f) => {
          tl.set("#s2range", { scale: 1.04 }, G(f));
          tl.to("#s2range", { scale: 1, duration: D(8), ease: "power2.out" }, G(f));
        });

        // Bild 3 (F307–359): "EXHAUSTED" ersetzt die Überschrift, Akku blinkt rot, Herzschlag-Vignette
        tl.to("#s2range", { opacity: 0, y: -60, duration: D(4), ease: "power2.in" }, G(303));
        tl.fromTo("#s2ex", { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: D(5), ease: "power4.out" }, G(306));
        tl.set("#s2ex", { scale: 1.06 }, G(325));
        tl.to("#s2ex", { scale: 1, duration: D(8), ease: "power2.out" }, G(325));
        shake("#s2cam", 309, 8, 22, 45);
        [309, 325].forEach((f) => {
          tl.set("#s2red", { opacity: 0.9 }, G(f));
          tl.to("#s2red", { opacity: 0.25, duration: D(10), ease: "power2.out" }, G(f));
          tl.set("#s2bat", { opacity: 0.4 }, G(f + 4));
          tl.set("#s2bat", { opacity: 1 }, G(f + 8));
        });

        window.__timelines = window.__timelines || {};
        window.__timelines["s2-sprint"] = tl;
      })();
    </script>
  </div>
</template>
