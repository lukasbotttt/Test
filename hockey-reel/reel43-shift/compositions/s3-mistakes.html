<template id="s3-mistakes-template">
  <!-- S3 MISTAKES · global 11,8–15,2 s (F354–455), lokal = global − 354. Länger draußen = Fehler stapeln sich (ein Text-Block). -->
  <div data-composition-id="s3-mistakes" data-width="1080" data-height="1920" data-duration="3.4">
    <div class="scn">
      <div class="cam" id="s3cam" data-layout-allow-overflow>
        <div class="sky"></div>
        <svg class="cracks" viewBox="0 0 1080 1920" data-layout-ignore>
          <g id="s3cracks" fill="none" stroke="#ff4d6d" stroke-width="5" stroke-linecap="round" opacity="0">
            <polyline points="540,980 470,860 500,760 420,640 450,520"/><polyline points="540,980 660,900 700,780 820,720"/>
            <polyline points="540,980 600,1100 560,1240 640,1380"/><polyline points="540,980 400,1040 300,1000 180,1080"/>
            <polyline points="470,860 380,830"/><polyline points="660,900 760,960"/>
          </g>
        </svg>
        <div id="s3pile" class="pile"></div>
        <div class="vig" data-layout-ignore></div>
      </div>
      <div id="s3mis" class="mis">
        <span class="lay r" aria-hidden="true" data-layout-allow-overlap>MISTAKES</span><span class="lay c" aria-hidden="true" data-layout-allow-overlap>MISTAKES</span><span class="lay main" data-layout-allow-overlap>MISTAKES</span></div>
      <div id="s3pileup" class="pileup">PILE UP</div>
      <div id="s3flash" class="flash"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      [data-composition-id="s3-mistakes"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #12000a; }
      [data-composition-id="s3-mistakes"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s3-mistakes"] .sky { position: absolute; inset: 0;
        background: radial-gradient(ellipse 70% 45% at 50% 60%, rgba(255,23,68,0.35), rgba(0,0,0,0) 70%),
                    repeating-linear-gradient(135deg, rgba(255,23,68,0.07) 0 40px, rgba(0,0,0,0) 40px 80px), #12000a; }
      [data-composition-id="s3-mistakes"] .cracks { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
        filter: drop-shadow(0 0 8px rgba(255,23,68,0.9)); }
      [data-composition-id="s3-mistakes"] .pile { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s3-mistakes"] .tile { position: absolute; width: 170px; height: 170px; border-radius: 26px;
        background: #1c0008; border: 8px solid #ff1744; box-shadow: 0 0 26px rgba(255,23,68,0.85), 0 20px 40px rgba(0,0,0,0.8); }
      [data-composition-id="s3-mistakes"] .tile svg { position: absolute; left: 25px; top: 25px; width: 104px; height: 104px; }
      [data-composition-id="s3-mistakes"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%); }
      [data-composition-id="s3-mistakes"] .mis { position: absolute; left: 0; top: 260px; width: 1080px; height: 240px; opacity: 0;
        font-family: "Anton", sans-serif; font-size: 220px; line-height: 1; text-align: center; }
      [data-composition-id="s3-mistakes"] .lay { position: absolute; left: 0; top: 0; width: 1080px; text-align: center; }
      [data-composition-id="s3-mistakes"] .lay.r { color: #ff0050; mix-blend-mode: screen; }
      [data-composition-id="s3-mistakes"] .lay.c { color: #00f0ff; mix-blend-mode: screen; }
      [data-composition-id="s3-mistakes"] .lay.main { color: #ff1744; -webkit-text-stroke: 5px #14000a; paint-order: stroke fill;
        text-shadow: 0 0 20px rgba(255,23,68,0.95), 0 0 70px rgba(255,23,68,0.6), 0 12px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s3-mistakes"] .pileup { position: absolute; left: 0; top: 520px; width: 1080px; text-align: center; opacity: 0;
        font-family: "Anton", sans-serif; font-size: 170px; line-height: 1; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s3-mistakes"] .flash { position: absolute; inset: 0; background: #ff1744; opacity: 0; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 354;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const split = (sel, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const a = amp * (0.4 + 0.6 * r());
            tl.set(sel + " .r", { x: -a, y: (r() - 0.5) * 6 }, G(f0 + i)); tl.set(sel + " .c", { x: a, y: (r() - 0.5) * 6 }, G(f0 + i)); }
          tl.set([sel + " .r", sel + " .c"], { x: 0, y: 0 }, G(f0 + n)); };

        // F360 roter Schnitt rein: Risse leuchten auf, langsamer Zoom = Druck steigt
        tl.fromTo("#s3cracks", { opacity: 0 }, { opacity: 0.9, duration: D(4), ease: "power2.out" }, G(360));
        tl.to("#s3cracks", { opacity: 0.35, duration: D(40), ease: "none" }, G(366));
        tl.fromTo("#s3cam", { scale: 1 }, { scale: 1.05, duration: D(96), ease: "none" }, G(360));
        // nur EIN Text-Block: MISTAKES (F366) + PILE UP (F372), stehen bis zum Schnitt (≈ 2,6 s)
        tl.fromTo("#s3mis", { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: D(6), ease: "power4.out" }, G(366));
        split("#s3mis", 372, 5, 14, 52);
        tl.fromTo("#s3pileup", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: D(6), ease: "back.out(1.8)" }, G(372));

        // Fehler-Kacheln (rotes X) fallen und stapeln sich zur Pyramide; drei große Einschläge auf
        // "mistakes" (F402), "pile" (F411), "up" (F421)
        (function () { const box = document.querySelector("#s3pile"), r = rng(77);
          const slots = [];
          [[4, 1640], [3, 1460], [2, 1280], [1, 1100]].forEach(([n, y]) => {
            for (let i = 0; i < n; i++) slots.push([540 - (n * 190 - 20) / 2 + i * 190, y]); });
          const at = [380, 386, 392, 398, 402, 406, 411, 416, 421, 428];
          slots.forEach(([x, y], i) => {
            const d = document.createElement("div"); d.className = "tile";
            d.style.left = Math.round(x) + "px"; d.style.top = y + "px";
            d.innerHTML = '<svg viewBox="0 0 100 100"><g stroke="#ffffff" stroke-width="16" stroke-linecap="round"><line x1="18" y1="18" x2="82" y2="82"/><line x1="82" y1="18" x2="18" y2="82"/></g></svg>';
            box.appendChild(d);
            const rot = (r() * 2 - 1) * 12;
            tl.fromTo(d, { y: -y - 260, rotation: rot * 3, opacity: 1 }, { y: 0, rotation: rot, duration: D(7), ease: "power3.in" }, G(at[i] - 7));
            tl.to(d, { y: -20, duration: D(3), ease: "power2.out", yoyo: true, repeat: 1 }, G(at[i]));
          });
        })();
        [402, 411, 421].forEach((f, i) => {
          shake("#s3cam", f, 5, 16 + i * 4, 53 + i);
          tl.set("#s3flash", { opacity: 0.2 }, G(f));
          tl.to("#s3flash", { opacity: 0, duration: D(5), ease: "power2.in" }, G(f));
        });

        window.__timelines = window.__timelines || {};
        window.__timelines["s3-mistakes"] = tl;
      })();
    </script>
  </div>
</template>
