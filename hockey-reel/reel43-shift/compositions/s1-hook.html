<template id="s1-hook-template">
  <!-- S1 HOOK · global 0–4,7 s (F0–140), lokal = global. Frage ab Bild 0, Neon-Stoppuhr läuft auf 00:40, dann steht alles still. -->
  <div data-composition-id="s1-hook" data-width="1080" data-height="1920" data-duration="4.7">
    <div class="scn">
      <div class="cam" id="s1cam">
        <div class="sky"></div>
        <div class="lights">
          <i style="left:90px;top:120px"></i><i style="left:250px;top:70px"></i><i style="left:430px;top:140px"></i>
          <i style="left:610px;top:80px"></i><i style="left:790px;top:130px"></i><i style="left:950px;top:60px"></i>
        </div>
        <div class="floorwrap" data-layout-allow-overflow>
          <div class="floor" data-layout-allow-overflow><div id="s1floor" class="floorin" data-layout-allow-overflow>
            <svg width="1400" height="3200" viewBox="0 0 1400 3200">
              <g fill="none" stroke-linecap="round">
                <rect x="40" y="40" width="1320" height="3120" rx="300" stroke="#00f0ff" stroke-width="10" opacity="0.8"/>
                <line x1="40" y1="1600" x2="1360" y2="1600" stroke="#ff1744" stroke-width="22"/>
                <line x1="40" y1="1060" x2="1360" y2="1060" stroke="#2f7bff" stroke-width="26"/>
                <line x1="40" y1="2140" x2="1360" y2="2140" stroke="#2f7bff" stroke-width="26"/>
                <circle cx="700" cy="1600" r="260" stroke="#2f7bff" stroke-width="10"/>
                <circle cx="340" cy="700" r="200" stroke="#ff1744" stroke-width="8"/>
                <circle cx="1060" cy="700" r="200" stroke="#ff1744" stroke-width="8"/>
                <circle cx="340" cy="2500" r="200" stroke="#ff1744" stroke-width="8"/>
                <circle cx="1060" cy="2500" r="200" stroke="#ff1744" stroke-width="8"/>
              </g>
            </svg>
          </div></div>
        </div>
        <div class="haze"></div>
        <!-- Vordergrund-Objekt: Neon-Stoppuhr (Vektor) -->
        <div id="s1watchwrap" class="watchwrap">
          <svg class="watch" viewBox="0 0 600 680">
            <defs>
              <radialGradient id="s1face" cx="0.5" cy="0.42" r="0.6">
                <stop offset="0" stop-color="#1b1830"/><stop offset="1" stop-color="#05040b"/>
              </radialGradient>
            </defs>
            <rect x="262" y="8" width="76" height="44" rx="10" fill="#14121f" stroke="#00f0ff" stroke-width="6"/>
            <rect x="284" y="50" width="32" height="44" fill="#14121f" stroke="#00f0ff" stroke-width="6"/>
            <rect x="470" y="96" width="56" height="34" rx="8" fill="#14121f" stroke="#00f0ff" stroke-width="6" transform="rotate(42 498 113)"/>
            <circle cx="300" cy="380" r="272" fill="url(#s1face)" stroke="#00f0ff" stroke-width="14"/>
            <circle cx="300" cy="380" r="236" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
            <g id="s1ticks"></g>
            <path id="s1arc" d="M300 158 A222 222 0 1 1 299.9 158" fill="none" stroke="#ff1744" stroke-width="16"
                  stroke-linecap="round" stroke-dasharray="1395" stroke-dashoffset="1395" opacity="0.85"/>
            <g id="s1hand"><line x1="300" y1="380" x2="300" y2="176" stroke="#ff1744" stroke-width="10" stroke-linecap="round"/>
              <line x1="300" y1="380" x2="300" y2="430" stroke="#ff1744" stroke-width="10" stroke-linecap="round"/></g>
            <circle cx="300" cy="380" r="20" fill="#ff1744"/>
            <circle cx="300" cy="380" r="8" fill="#fff"/>
            <rect x="148" y="448" width="304" height="96" rx="22" fill="#05040b" fill-opacity="0.9" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="3"/>
            <text id="s1read" x="300" y="526" text-anchor="middle" class="read">00:00</text>
          </svg>
        </div>
        <div class="vig" data-layout-ignore></div>
      </div>
      <div id="s1why" class="why">WHY ONLY</div>
      <div id="s1forty" class="forty" data-layout-allow-overflow>
        <span class="lay r" aria-hidden="true" data-layout-allow-overlap>40</span><span class="lay c" aria-hidden="true" data-layout-allow-overlap>40</span><span class="lay main" data-layout-allow-overlap>40</span></div>
      <div id="s1sec" class="sec">SECONDS?</div>
      <div id="s1flash" class="flash"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      @font-face { font-family: "JBMono"; src: url("fonts/JBMono700.ttf"); }
      [data-composition-id="s1-hook"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #02040c; }
      [data-composition-id="s1-hook"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s1-hook"] .sky { position: absolute; inset: 0;
        background: radial-gradient(ellipse 70% 40% at 50% 38%, rgba(0,140,255,0.32), rgba(0,0,0,0) 70%),
                    radial-gradient(ellipse 60% 35% at 50% 62%, rgba(255,23,68,0.20), rgba(0,0,0,0) 70%), #02040c; }
      [data-composition-id="s1-hook"] .lights i { position: absolute; width: 46px; height: 46px; border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, rgba(200,240,255,0.9) 25%, rgba(0,240,255,0.0) 70%); }
      [data-composition-id="s1-hook"] .floorwrap { position: absolute; left: -160px; top: 760px; width: 1400px; height: 1700px;
        perspective: 900px; perspective-origin: 50% 0%; overflow: hidden; }
      [data-composition-id="s1-hook"] .floor { position: absolute; left: 0; top: 0; width: 1400px; height: 3200px;
        transform-origin: 50% 0%; transform: rotateX(68deg); filter: drop-shadow(0 0 12px rgba(0,240,255,0.8)); }
      [data-composition-id="s1-hook"] .floorin { position: absolute; left: 0; top: 0; width: 1400px; height: 3200px;
        background-image: linear-gradient(rgba(0,240,255,0.16) 3px, transparent 3px), linear-gradient(90deg, rgba(0,140,255,0.12) 3px, transparent 3px);
        background-size: 140px 140px; }
      [data-composition-id="s1-hook"] .haze { position: absolute; left: 0; top: 700px; width: 1080px; height: 360px;
        background: linear-gradient(180deg, rgba(2,4,12,1) 0%, rgba(2,4,12,0) 100%); }
      [data-composition-id="s1-hook"] .watchwrap { position: absolute; left: 270px; top: 860px; width: 540px; height: 612px; }
      [data-composition-id="s1-hook"] .watch { width: 540px; height: 612px;
        filter: drop-shadow(0 0 24px rgba(0,240,255,0.75)) drop-shadow(0 40px 50px rgba(0,0,0,0.9)); }
      [data-composition-id="s1-hook"] .read { font-family: "JBMono", monospace; font-size: 84px; fill: #ffffff; }
      [data-composition-id="s1-hook"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%); }
      [data-composition-id="s1-hook"] .why { position: absolute; left: 0; top: 150px; width: 1080px; text-align: center;
        font-family: "Anton", sans-serif; font-size: 120px; line-height: 1; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s1-hook"] .forty { position: absolute; left: 0; top: 270px; width: 1080px; height: 400px;
        font-family: "Anton", sans-serif; font-size: 380px; line-height: 1; text-align: center; }
      [data-composition-id="s1-hook"] .lay { position: absolute; left: 0; top: 0; width: 1080px; text-align: center; }
      [data-composition-id="s1-hook"] .lay.r { color: #ff0050; mix-blend-mode: screen; }
      [data-composition-id="s1-hook"] .lay.c { color: #00f0ff; mix-blend-mode: screen; }
      [data-composition-id="s1-hook"] .lay.main { color: #ff1744; -webkit-text-stroke: 6px #14000a; paint-order: stroke fill;
        text-shadow: 0 0 18px rgba(255,23,68,0.9), 0 0 70px rgba(255,23,68,0.6), 0 12px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s1-hook"] .sec { position: absolute; left: 0; top: 670px; width: 1080px; text-align: center;
        font-family: "Anton", sans-serif; font-size: 150px; line-height: 1; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s1-hook"] .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 0;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const split = (sel, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const a = amp * (0.4 + 0.6 * r());
            tl.set(sel + " .r", { x: -a, y: (r() - 0.5) * 6 }, G(f0 + i)); tl.set(sel + " .c", { x: a, y: (r() - 0.5) * 6 }, G(f0 + i)); }
          tl.set([sel + " .r", sel + " .c"], { x: 0, y: 0 }, G(f0 + n)); };

        // 60 Skalenstriche der Stoppuhr (alle 5 Sekunden lang)
        (function () { const g = document.querySelector("#s1ticks"), ns = "http://www.w3.org/2000/svg";
          for (let i = 0; i < 60; i++) { const a = i * 6 * Math.PI / 180, long = i % 5 === 0;
            const r1 = long ? 196 : 212, r2 = 230, l = document.createElementNS(ns, "line");
            l.setAttribute("x1", 300 + Math.sin(a) * r1); l.setAttribute("y1", 380 - Math.cos(a) * r1);
            l.setAttribute("x2", 300 + Math.sin(a) * r2); l.setAttribute("y2", 380 - Math.cos(a) * r2);
            l.setAttribute("stroke", long ? "#00f0ff" : "#5d6b80"); l.setAttribute("stroke-width", long ? 8 : 4);
            g.appendChild(l); } })();

        // Eisfläche rast auf die Kamera zu, Hallenlichter flackern
        tl.fromTo("#s1floor", { y: -700 }, { y: 120, duration: D(141), ease: "power1.out" }, G(0));
        document.querySelectorAll('[data-composition-id="s1-hook"] .lights i').forEach((el, i) => {
          const r = rng(100 + i);
          for (let f = 0; f < 141; f += 4) tl.set(el, { opacity: 0.55 + 0.45 * r(), scale: 0.85 + 0.35 * r() }, G(f));
        });
        // F0 Bass-Drop: Frage steht ab Bild 0, "40" mit RGB-Split, Stoppuhr schlägt aus Kamerarichtung ein
        tl.fromTo("#s1forty", { scale: 1.2 }, { scale: 1, duration: D(5), ease: "power4.out" }, G(0));
        split("#s1forty", 0, 6, 14, 12);
        tl.fromTo("#s1watchwrap", { scale: 3, y: 300, rotation: -16 }, { scale: 1, y: 0, rotation: -4, duration: D(7), ease: "power3.in" }, G(0));
        shake("#s1cam", 7, 8, 30, 11);
        // Objekt-Separation: Uhr kommt danach langsam auf den Zuschauer zu
        tl.to("#s1watchwrap", { scale: 1.15, y: -30, rotation: 3, duration: D(134), ease: "power1.inOut" }, G(7));
        // Zeiger + Anzeige: 0 -> 40 s bis F86 ("seconds"), Bogen läuft mit
        tl.fromTo("#s1hand", { rotation: 0, svgOrigin: "300 380" }, { rotation: 240, svgOrigin: "300 380", duration: D(84), ease: "power2.in" }, G(2));
        tl.fromTo("#s1arc", { attr: { "stroke-dashoffset": 1395 } }, { attr: { "stroke-dashoffset": 1395 - 1395 * 40 / 60 }, duration: D(84), ease: "power2.in" }, G(2));
        for (let f = 2; f <= 86; f += 2) {
          const s = Math.round(40 * Math.pow((f - 2) / 84, 2));
          tl.set("#s1read", { textContent: "00:" + String(s).padStart(2, "0") }, G(f));
        }
        tl.set("#s1read", { fill: "#ff1744" }, G(86));
        tl.fromTo("#s1watchwrap", { filter: "brightness(1.8)" }, { filter: "brightness(1)", duration: D(10), ease: "power2.out" }, G(86));
        // sanfte Beat-Pulse auf "40", großer Puls auf das gesprochene "forty" (F79), Blitz wenn die Uhr steht (F86)
        [15, 30, 45, 60, 105, 120].forEach((f) => {
          tl.set("#s1forty", { scale: 1.04 }, G(f));
          tl.to("#s1forty", { scale: 1, duration: D(8), ease: "power2.out" }, G(f));
        });
        tl.set("#s1forty", { scale: 1.12 }, G(79));
        tl.to("#s1forty", { scale: 1, duration: D(10), ease: "power3.out" }, G(79));
        tl.set("#s1flash", { opacity: 0.45 }, G(86));
        tl.to("#s1flash", { opacity: 0, duration: D(5), ease: "power2.in" }, G(86));
        shake("#s1cam", 86, 6, 18, 14);

        window.__timelines = window.__timelines || {};
        window.__timelines["s1-hook"] = tl;
      })();
    </script>
  </div>
</template>
