<template id="s4-proof-template">
  <!-- S4 PROOF · global 14,8–21,7 s (F444–650), lokal = global − 444. Flyers: 44 s -> 41 s pro Wechsel, weniger Gegentore. -->
  <div data-composition-id="s4-proof" data-width="1080" data-height="1920" data-duration="6.9">
    <div class="scn">
      <div class="cam" id="s4cam" data-layout-allow-overflow>
        <div class="sky"></div>
        <div id="s4rays" class="rays" data-layout-ignore></div>
        <div id="s4dust" class="dust"></div>
        <div class="chart">
          <div class="base"></div>
          <div id="s4ghL" class="ghost ghL"></div>
          <div id="s4ghR" class="ghost ghR"></div>
          <div id="s4barL" class="bar barL"></div>
          <div id="s4barR" class="bar barR"></div>
          <div id="s4valL" class="val valL">0s</div>
          <div id="s4valR" class="val valR">0s</div>
          <div class="yr yrL">2018-19</div>
          <div class="yr yrR">2019-20</div>
        </div>
        <div class="vig" data-layout-ignore></div>
      </div>
      <div id="s4pill" class="pill">PHILADELPHIA FLYERS</div>
      <div class="badgewrap"><div id="s4badge" class="badge">−3 SEC</div></div>
      <div id="s4fewer" class="fewer">
        <svg class="chk" viewBox="0 0 100 100"><polyline points="14,54 40,80 88,22" fill="none" stroke="#c6ff2e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="f1">FEWER GOALS</div><div class="f2">ALLOWED</div>
      </div>
      <div id="s4flash" class="flash"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      @font-face { font-family: "JBMono"; src: url("fonts/JBMono700.ttf"); }
      [data-composition-id="s4-proof"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0a0503; }
      [data-composition-id="s4-proof"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s4-proof"] .sky { position: absolute; inset: 0;
        background: radial-gradient(ellipse 70% 40% at 50% 45%, rgba(255,106,0,0.30), rgba(0,0,0,0) 70%),
                    radial-gradient(ellipse 60% 30% at 50% 90%, rgba(0,240,255,0.15), rgba(0,0,0,0) 70%), #0a0503; }
      [data-composition-id="s4-proof"] .rays { position: absolute; left: -460px; top: -260px; width: 2000px; height: 2000px; opacity: 0.5;
        background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,106,0,0.22) 0deg 7deg, rgba(0,0,0,0) 7deg 22deg);
        -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,0) 62%); }
      [data-composition-id="s4-proof"] .dust { position: absolute; inset: 0; }
      [data-composition-id="s4-proof"] .dt { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #ffb070; }
      [data-composition-id="s4-proof"] .chart { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s4-proof"] .base { position: absolute; left: 120px; top: 1350px; width: 840px; height: 8px; border-radius: 4px; background: #ffffff; opacity: 0.8; }
      [data-composition-id="s4-proof"] .bar { position: absolute; bottom: 570px; width: 260px; height: 0px; border-radius: 22px 22px 0 0; transform-origin: 50% 100%; }
      [data-composition-id="s4-proof"] .ghost { position: absolute; top: 700px; width: 260px; height: 650px; border-radius: 22px 22px 0 0;
        border: 4px dashed rgba(255,255,255,0.28); border-bottom: none; transform-origin: 50% 100%; }
      [data-composition-id="s4-proof"] .ghL { left: 190px; }
      [data-composition-id="s4-proof"] .ghR { left: 630px; border-color: rgba(255,138,43,0.4); }
      [data-composition-id="s4-proof"] .barL { left: 190px; background: linear-gradient(180deg, #e9eef5, #8792a3); box-shadow: 0 0 26px rgba(255,255,255,0.35); }
      [data-composition-id="s4-proof"] .barR { left: 630px; background: linear-gradient(180deg, #ff8a2b, #c43d00); box-shadow: 0 0 40px rgba(255,106,0,0.85); }
      [data-composition-id="s4-proof"] .val { position: absolute; width: 360px; text-align: center; font-family: "Anton", sans-serif; font-size: 150px; line-height: 1;
        opacity: 0; text-shadow: 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s4-proof"] .valL { left: 140px; top: 560px; color: #fff; }
      [data-composition-id="s4-proof"] .valR { left: 580px; top: 600px; color: #ff8a2b; text-shadow: 0 0 24px rgba(255,106,0,0.8), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s4-proof"] .yr { position: absolute; top: 1374px; width: 360px; text-align: center; font-family: "JBMono", monospace; font-size: 40px; color: #c9d3e0; }
      [data-composition-id="s4-proof"] .yrL { left: 140px; }
      [data-composition-id="s4-proof"] .yrR { left: 580px; color: #ff8a2b; }
      [data-composition-id="s4-proof"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%); }
      [data-composition-id="s4-proof"] .pill { position: absolute; left: 140px; top: 140px; width: 800px; height: 120px; border-radius: 60px; opacity: 0;
        border: 5px solid #ff6a00; background: rgba(30,10,0,0.85); box-shadow: 0 0 34px rgba(255,106,0,0.8);
        font-family: "Anton", sans-serif; font-size: 74px; line-height: 110px; text-align: center; color: #fff; }
      [data-composition-id="s4-proof"] .badgewrap { position: absolute; left: 330px; top: 395px; width: 420px; height: 140px; transform: rotate(-6deg); }
      [data-composition-id="s4-proof"] .badge { width: 420px; height: 140px; border-radius: 30px; opacity: 0;
        background: #c6ff2e; color: #0b1000; font-family: "Anton", sans-serif; font-size: 110px; line-height: 140px; text-align: center;
        box-shadow: 0 0 40px rgba(198,255,46,0.9), 0 20px 40px rgba(0,0,0,0.8); }
      [data-composition-id="s4-proof"] .fewer { position: absolute; left: 0; top: 1450px; width: 1080px; height: 290px; opacity: 0; }
      [data-composition-id="s4-proof"] .chk { position: absolute; left: 70px; top: 40px; width: 170px; height: 170px; filter: drop-shadow(0 0 16px rgba(198,255,46,0.9)); }
      [data-composition-id="s4-proof"] .f1 { position: absolute; left: 250px; top: 0; width: 800px; font-family: "Anton", sans-serif; font-size: 150px; line-height: 1;
        color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s4-proof"] .f2 { position: absolute; left: 250px; top: 160px; width: 800px; font-family: "Anton", sans-serif; font-size: 110px; line-height: 1;
        color: #c6ff2e; text-shadow: 0 0 20px rgba(198,255,46,0.8), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s4-proof"] .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 444;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const PX = 14;                                   // 1 Sekunde Wechsellänge = 14 px Balkenhöhe (Achse ab 0, ehrlich)

        // Lichtstrahlen drehen, Funken steigen
        tl.fromTo("#s4rays", { rotation: 0 }, { rotation: 45, duration: D(207), ease: "none" }, G(444));
        (function () { const box = document.querySelector("#s4dust"), r = rng(13);
          for (let i = 0; i < 22; i++) {
            const d = document.createElement("div"); d.className = "dt";
            d.style.left = Math.round(r() * 1080) + "px"; d.style.top = Math.round(600 + r() * 1300) + "px";
            d.style.opacity = (0.3 + r() * 0.6).toFixed(2); box.appendChild(d);
            tl.fromTo(d, { y: 0 }, { y: -300 - r() * 400, duration: D(207), ease: "none" }, G(444));
          } })();

        // F456 Pille FLYERS (auf "Flyers"), Achse + leere Balken-Rahmen warten auf die Zahlen
        tl.fromTo("#s4pill", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: D(7), ease: "back.out(2.2)" }, G(456));
        tl.fromTo('[data-composition-id="s4-proof"] .base', { scaleX: 0 }, { scaleX: 1, duration: D(10), ease: "expo.out" }, G(454));
        tl.fromTo(["#s4ghL", "#s4ghR"], { scaleY: 0 }, { scaleY: 1, duration: D(10), ease: "expo.out", stagger: D(3) }, G(462));
        tl.fromTo('[data-composition-id="s4-proof"] .yr', { opacity: 0 }, { opacity: 1, duration: D(6), ease: "none" }, G(464));
        // F506–516 Balken 44 s (auf "forty-four", F511), F530–540 Balken 41 s (auf "forty-one", F537)
        tl.fromTo("#s4barL", { height: 0 }, { height: 44 * PX, duration: D(10), ease: "power3.out" }, G(506));
        tl.fromTo("#s4valL", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: D(5), ease: "power2.out" }, G(507));
        for (let f = 507; f <= 516; f++) tl.set("#s4valL", { textContent: Math.round(44 * (f - 506) / 10) + "s" }, G(f));
        tl.fromTo("#s4barR", { height: 0 }, { height: 41 * PX, duration: D(10), ease: "power3.out" }, G(530));
        tl.fromTo("#s4valR", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: D(5), ease: "power2.out" }, G(531));
        for (let f = 531; f <= 540; f++) tl.set("#s4valR", { textContent: Math.round(41 * (f - 530) / 10) + "s" }, G(f));
        tl.set("#s4barR", { filter: "brightness(1.7)" }, G(540));
        tl.to("#s4barR", { filter: "brightness(1)", duration: D(8), ease: "power2.out" }, G(540));
        // F548 Badge −3 SEC (auf "seconds", F551)
        tl.fromTo("#s4badge", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: D(6), ease: "power4.out" }, G(548));
        shake("#s4cam", 551, 5, 14, 82);
        [570, 615, 630].forEach((f) => {
          tl.set("#s4badge", { scale: 1.05 }, G(f));
          tl.to("#s4badge", { scale: 1, duration: D(8), ease: "power2.out" }, G(f));
        });

        // F580 FEWER GOALS ALLOWED (auf "allowed"), Haken zeichnet sich, Puls + Blitz auf "fewer" (F595)
        tl.fromTo("#s4fewer", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: D(7), ease: "expo.out" }, G(580));
        tl.fromTo('[data-composition-id="s4-proof"] .chk polyline', { attr: { "stroke-dasharray": 140, "stroke-dashoffset": 140 } },
          { attr: { "stroke-dasharray": 140, "stroke-dashoffset": 0 }, duration: D(8), ease: "power2.out" }, G(584));
        tl.set("#s4fewer", { scale: 1.06 }, G(595));
        tl.to("#s4fewer", { scale: 1, duration: D(10), ease: "power3.out" }, G(595));
        tl.set("#s4flash", { opacity: 0.3 }, G(595));
        tl.to("#s4flash", { opacity: 0, duration: D(5), ease: "power2.in" }, G(595));
        shake("#s4cam", 595, 7, 18, 83);

        window.__timelines = window.__timelines || {};
        window.__timelines["s4-proof"] = tl;
      })();
    </script>
  </div>
</template>
