<template id="s2-rule-template">
  <!-- S2 RULE · global 2,3–10,7 s (F69–320), lokal = global − 69. Schaufel über der Torlatte (4 ft) = kein Tor (Regel 80.3). -->
  <div data-composition-id="s2-rule" data-width="1080" data-height="1920" data-duration="8.4">
    <div class="scn">
      <div class="cam" id="s2cam" data-layout-allow-overflow>
        <div class="sky"></div>
        <svg class="side" viewBox="0 0 1080 1920" data-layout-ignore>
          <defs>
            <pattern id="s2mesh" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <path d="M0 0 L0 26 M0 0 L26 0" stroke="#dfe9f5" stroke-opacity="0.4" stroke-width="3" fill="none"/></pattern>
            <linearGradient id="s2ice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123059"/><stop offset="1" stop-color="#06101f"/></linearGradient>
          </defs>
          <rect x="0" y="1560" width="1080" height="360" fill="url(#s2ice)"/>
          <line x1="0" y1="1560" x2="1080" y2="1560" stroke="#bfefff" stroke-width="6"/>
          <path id="s2lampdome" d="M890 1000 L890 960 A40 40 0 0 1 970 960 L970 1000 Z" fill="#4a0a16" stroke="#ff5a76" stroke-width="4"/>
          <circle id="s2lampglow" cx="930" cy="975" r="110" fill="rgba(255,23,68,0.6)" opacity="0" style="filter:blur(18px)"/>
          <polygon points="820,1120 905,1120 1015,1340 1015,1560 820,1560" fill="url(#s2mesh)"/>
          <path d="M820 1560 L820 1120 L905 1120 L1015 1340 L1015 1560" fill="none" stroke="#ff1744" stroke-width="16" stroke-linejoin="round"/>
          <g id="s2line" opacity="0">
            <line id="s2dash" x1="30" y1="1120" x2="1050" y2="1120" stroke="#c6ff2e" stroke-width="6" stroke-dasharray="26 16"/>
            <text id="s2lab" x="40" y="1098" class="lab">CROSSBAR · 4 FT</text>
          </g>
          <path id="s2stick" d="M430 560 L430 990 Q430 1020 460 1020 L580 1020" fill="none" stroke="#ff1744" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
          <g id="s2puck" opacity="0"><rect x="-34" y="-12" width="68" height="24" rx="8" fill="#0a0a0f" stroke="#e8f6ff" stroke-width="4"/></g>
          <circle id="s2ring" cx="0" cy="0" r="40" fill="none" stroke="#ff1744" stroke-width="8" opacity="0"/>
        </svg>
        <svg class="side" viewBox="0 0 1080 1920" data-layout-ignore><text id="s2x" x="915" y="1470" text-anchor="middle" class="mark" fill="#ff1744" opacity="0">✕</text></svg>
        <div class="vig" data-layout-ignore></div>
      </div>
      <div id="s2a" class="t" style="top:170px;font-size:150px;opacity:0">STICK TOO HIGH</div>
      <div id="s2b" class="blk">
        <div id="s2b1" class="t" style="top:160px;font-size:120px;opacity:0">ABOVE THE CROSSBAR</div>
        <div id="s2b2" class="t" style="top:320px;font-size:170px;opacity:0;color:#ff2b55;text-shadow:0 0 20px rgba(255,23,68,0.85),0 10px 40px rgba(0,0,0,0.9)">= NO GOAL</div>
      </div>
      <div id="s2flash" class="flash"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      @font-face { font-family: "JBMono"; src: url("fonts/JBMono700.ttf"); }
      [data-composition-id="s2-rule"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #02040c; }
      [data-composition-id="s2-rule"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s2-rule"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%); }
      [data-composition-id="s2-rule"] .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      [data-composition-id="s2-rule"] .t { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap;
        font-family: "Anton", sans-serif; line-height: 1; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s2-rule"] .lime { color: #c6ff2e; text-shadow: 0 0 22px rgba(198,255,46,0.85), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s2-rule"] .cyan { color: #00f0ff; text-shadow: 0 0 22px rgba(0,240,255,0.85), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s2-rule"] .sky { position: absolute; inset: 0;
        background: radial-gradient(ellipse 80% 40% at 50% 65%, rgba(0,140,255,0.25), rgba(0,0,0,0) 70%), #02040c; }
      [data-composition-id="s2-rule"] .side { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; filter: drop-shadow(0 0 10px rgba(0,240,255,0.35)); }
      [data-composition-id="s2-rule"] .lab { font-family: "JBMono", monospace; font-size: 40px; fill: #c6ff2e; letter-spacing: 2px; }
      [data-composition-id="s2-rule"] .mark { font-family: "Anton", sans-serif; font-size: 300px; }
      [data-composition-id="s2-rule"] .blk { position: absolute; left: 0; top: 0; width: 1080px; height: 560px; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 69;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const pulse = (el, f, s) => { tl.set(el, { scale: s }, G(f)); tl.to(el, { scale: 1, duration: D(9), ease: "power2.out" }, G(f)); };

        const lampOn = (f) => { tl.set("#s2lampdome", { attr: { fill: "#ff1744" } }, G(f)); tl.set("#s2lampglow", { opacity: 1 }, G(f));
          tl.to("#s2lampglow", { opacity: 0, duration: D(12), ease: "power2.in" }, G(f + 4)); tl.set("#s2lampdome", { attr: { fill: "#4a0a16" } }, G(f + 14)); };
        const ring = (x, y, f, col) => { tl.set("#s2ring", { attr: { cx: x, cy: y, r: 30, stroke: col }, opacity: 1 }, G(f));
          tl.to("#s2ring", { attr: { r: 110 }, opacity: 0, duration: D(14), ease: "power2.out" }, G(f)); };
        // Puck-Flug: gerade Strecken mit Zeiten (Frame), Start unsichtbar
        const fly = (pts) => { tl.set("#s2puck", { x: pts[0][0], y: pts[0][1], opacity: 1 }, G(pts[0][2]));
          for (let i = 1; i < pts.length; i++) tl.to("#s2puck", { x: pts[i][0], y: pts[i][1], duration: D(pts[i][2] - pts[i - 1][2]), ease: "none" }, G(pts[i - 1][2])); };
        // Bild A: Puck kommt von links, trifft die Schaufel ÜBER der Latte (F79), springt ins Tor, Lampe – roter Ring
        tl.set("#s2puck", { opacity: 0 }, G(69));
        tl.set("#s2line", { opacity: 1 }, G(75));
        tl.fromTo("#s2dash", { attr: { x2: 30 } }, { attr: { x2: 1050 }, duration: D(8), ease: "power2.out" }, G(75));
        fly([[-80, 990, 75], [568, 1006, 79], [930, 1470, 87], [960, 1520, 92]]);
        ring(580, 1006, 79, "#ff1744");
        lampOn(88);
        tl.fromTo("#s2a", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: D(6), ease: "power4.out" }, G(80));
        tl.to("#s2stick", { rotation: -8, svgOrigin: "430 560", duration: D(6), ease: "power2.out" }, G(79));
        tl.to("#s2stick", { rotation: 0, svgOrigin: "430 560", duration: D(14), ease: "sine.inOut" }, G(85));
        // Bild B (ab F138): Text wechselt, Torlatten-Linie zeichnet sich (F176), Label "4 FT" (F225), Wiederholung, NO GOAL
        tl.to("#s2a", { opacity: 0, y: -60, duration: D(5), ease: "power2.in" }, G(136));
        tl.fromTo("#s2b1", { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: D(7), ease: "power3.out" }, G(174));
        tl.fromTo("#s2dash", { attr: { "stroke-width": 6 } }, { attr: { "stroke-width": 14 }, duration: D(6), yoyo: true, repeat: 1, ease: "sine.inOut" }, G(176));
        pulse("#s2lab", 226, 1.15);
        tl.set("#s2puck", { opacity: 0 }, G(140));
        fly([[-80, 990, 244], [568, 1006, 250], [930, 1470, 258], [960, 1520, 263]]);
        ring(580, 1006, 250, "#ff1744");
        tl.fromTo("#s2b2", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: D(6), ease: "power4.out" }, G(277));
        tl.fromTo("#s2x", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, svgOrigin: "915 1380", duration: D(5), ease: "power4.in" }, G(296));
        shake("#s2cam", 301, 6, 16, 22);
        tl.fromTo("#s2cam", { scale: 1.04 }, { scale: 1, duration: D(240), ease: "none" }, G(75));

        window.__timelines = window.__timelines || {};
        window.__timelines["s2-rule"] = tl;
      })();
    </script>
  </div>
</template>
