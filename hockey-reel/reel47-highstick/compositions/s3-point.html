<template id="s3-point-template">
  <!-- S3 POINT · global 10,3–13,2 s (F309–395), lokal = global − 309. Entscheidend ist der Kontaktpunkt: Schaft unter der Latte = Tor. -->
  <div data-composition-id="s3-point" data-width="1080" data-height="1920" data-duration="2.9">
    <div class="scn">
      <div class="cam" id="s3cam" data-layout-allow-overflow>
        <div class="sky"></div>
        <svg class="side" viewBox="0 0 1080 1920" data-layout-ignore>
          <defs>
            <pattern id="s3mesh" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <path d="M0 0 L0 26 M0 0 L26 0" stroke="#dfe9f5" stroke-opacity="0.4" stroke-width="3" fill="none"/></pattern>
            <linearGradient id="s3ice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123059"/><stop offset="1" stop-color="#06101f"/></linearGradient>
          </defs>
          <rect x="0" y="1560" width="1080" height="360" fill="url(#s3ice)"/>
          <line x1="0" y1="1560" x2="1080" y2="1560" stroke="#bfefff" stroke-width="6"/>
          <path id="s3lampdome" d="M890 1000 L890 960 A40 40 0 0 1 970 960 L970 1000 Z" fill="#4a0a16" stroke="#ff5a76" stroke-width="4"/>
          <circle id="s3lampglow" cx="930" cy="975" r="110" fill="rgba(255,23,68,0.6)" opacity="0" style="filter:blur(18px)"/>
          <polygon points="820,1120 905,1120 1015,1340 1015,1560 820,1560" fill="url(#s3mesh)"/>
          <path d="M820 1560 L820 1120 L905 1120 L1015 1340 L1015 1560" fill="none" stroke="#ff1744" stroke-width="16" stroke-linejoin="round"/>
          <g id="s3line" opacity="0">
            <line id="s3dash" x1="30" y1="1120" x2="1050" y2="1120" stroke="#c6ff2e" stroke-width="6" stroke-dasharray="26 16"/>
            <text id="s3lab" x="40" y="1098" class="lab">CROSSBAR · 4 FT</text>
          </g>
          <path id="s3stick" d="M300 1450 L300 2020 Q300 2050 330 2050 L450 2050" transform="rotate(-150 300 1450)" fill="none" stroke="#ff1744" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
          <g id="s3puck" opacity="0"><rect x="-34" y="-12" width="68" height="24" rx="8" fill="#0a0a0f" stroke="#e8f6ff" stroke-width="4"/></g>
          <circle id="s3ring" cx="0" cy="0" r="40" fill="none" stroke="#ff1744" stroke-width="8" opacity="0"/>
        </svg>
        <svg class="side" viewBox="0 0 1080 1920" data-layout-ignore>
          <text id="s3ok" x="40" y="1530" class="ok" opacity="0">✓ BELOW THE BAR</text></svg>
        <div class="vig" data-layout-ignore></div>
      </div>
      <div id="s3a" class="t" style="top:150px;font-size:130px;opacity:0">WHERE THE PUCK</div>
      <div id="s3b" class="t lime" style="top:300px;font-size:130px;opacity:0">HITS THE STICK</div>
      <div id="s3flash" class="flash"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      @font-face { font-family: "JBMono"; src: url("fonts/JBMono700.ttf"); }
      [data-composition-id="s3-point"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #02040c; }
      [data-composition-id="s3-point"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s3-point"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%); }
      [data-composition-id="s3-point"] .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      [data-composition-id="s3-point"] .t { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap;
        font-family: "Anton", sans-serif; line-height: 1; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s3-point"] .lime { color: #c6ff2e; text-shadow: 0 0 22px rgba(198,255,46,0.85), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s3-point"] .cyan { color: #00f0ff; text-shadow: 0 0 22px rgba(0,240,255,0.85), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s3-point"] .sky { position: absolute; inset: 0;
        background: radial-gradient(ellipse 80% 40% at 50% 65%, rgba(0,140,255,0.25), rgba(0,0,0,0) 70%), #02040c; }
      [data-composition-id="s3-point"] .side { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; filter: drop-shadow(0 0 10px rgba(0,240,255,0.35)); }
      [data-composition-id="s3-point"] .lab { font-family: "JBMono", monospace; font-size: 40px; fill: #c6ff2e; letter-spacing: 2px; }
      [data-composition-id="s3-point"] .mark { font-family: "Anton", sans-serif; font-size: 300px; }
      [data-composition-id="s3-point"] .ok { font-family: "Anton", sans-serif; font-size: 64px; fill: #c6ff2e; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 309;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const pulse = (el, f, s) => { tl.set(el, { scale: s }, G(f)); tl.to(el, { scale: 1, duration: D(9), ease: "power2.out" }, G(f)); };

        const lampOn = (f) => { tl.set("#s3lampdome", { attr: { fill: "#ff1744" } }, G(f)); tl.set("#s3lampglow", { opacity: 1 }, G(f));
          tl.to("#s3lampglow", { opacity: 0, duration: D(12), ease: "power2.in" }, G(f + 4)); tl.set("#s3lampdome", { attr: { fill: "#4a0a16" } }, G(f + 14)); };
        const ring = (x, y, f, col) => { tl.set("#s3ring", { attr: { cx: x, cy: y, r: 30, stroke: col }, opacity: 1 }, G(f));
          tl.to("#s3ring", { attr: { r: 110 }, opacity: 0, duration: D(14), ease: "power2.out" }, G(f)); };
        // Puck-Flug: gerade Strecken mit Zeiten (Frame), Start unsichtbar
        const fly = (pts) => { tl.set("#s3puck", { x: pts[0][0], y: pts[0][1], opacity: 1 }, G(pts[0][2]));
          for (let i = 1; i < pts.length; i++) tl.to("#s3puck", { x: pts[i][0], y: pts[i][1], duration: D(pts[i][2] - pts[i - 1][2]), ease: "none" }, G(pts[i - 1][2])); };
        tl.set("#s3line", { opacity: 1 }, G(309));
        // Schaufel ist hoch, aber der Puck trifft den Schaft UNTER der Latte (F347) -> Tor zählt
        tl.fromTo("#s3a", { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: D(6), ease: "power3.out" }, G(318));
        tl.fromTo("#s3b", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: D(6), ease: "power4.out" }, G(324));
        tl.set("#s3puck", { opacity: 0 }, G(309));
        fly([[-80, 1294, 341], [370, 1294, 347], [930, 1470, 356], [960, 1520, 361]]);
        ring(390, 1294, 347, "#c6ff2e");
        tl.fromTo("#s3ok", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: D(6), ease: "power2.out" }, G(349));
        lampOn(357);
        pulse("#s3b", 372, 1.05);
        tl.fromTo("#s3cam", { scale: 1.04 }, { scale: 1, duration: D(87), ease: "none" }, G(309));

        window.__timelines = window.__timelines || {};
        window.__timelines["s3-point"] = tl;
      })();
    </script>
  </div>
</template>
