<template id="s5-zero-template">
  <!-- S5 ZERO · global 16,3–20,2 s (F489–605), lokal = global − 489. 3. Drittel: 0 Schüsse, 1 Tor. -->
  <div data-composition-id="s5-zero" data-width="1080" data-height="1920" data-duration="3.9">
    <div class="scn">
      <div class="cam" id="s5cam" data-layout-allow-overflow>
        <div class="sky"></div>
        <div id="s5row1" class="row r1"><div class="lab">SHOTS</div><div id="s5v1" class="val">0</div></div>
        <div id="s5row2" class="row r2"><div class="lab">GOALS</div><div id="s5v2" class="val">1</div></div>
        <div class="vig" data-layout-ignore></div>
      </div>
      <div id="s5a" class="t cyan" style="top:420px;font-size:110px;opacity:0">3RD PERIOD</div>
      <div id="s5flash" class="flash"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      @font-face { font-family: "JBMono"; src: url("fonts/JBMono700.ttf"); }
      [data-composition-id="s5-zero"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #02040c; }
      [data-composition-id="s5-zero"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s5-zero"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%); }
      [data-composition-id="s5-zero"] .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      [data-composition-id="s5-zero"] .t { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap;
        font-family: "Anton", sans-serif; line-height: 1; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s5-zero"] .lime { color: #c6ff2e; text-shadow: 0 0 22px rgba(198,255,46,0.85), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s5-zero"] .cyan { color: #00f0ff; text-shadow: 0 0 22px rgba(0,240,255,0.85), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s5-zero"] .sky { position: absolute; inset: 0;
        background: radial-gradient(ellipse 80% 40% at 50% 70%, rgba(0,140,255,0.25), rgba(0,0,0,0) 70%), #02040c; }
      [data-composition-id="s5-zero"] .row { position: absolute; left: 120px; width: 840px; height: 330px; border-radius: 40px; opacity: 0;
        background: linear-gradient(180deg, #0b0f18 0%, #05070c 100%); border: 6px solid #1f2b3d; box-shadow: 0 0 40px rgba(0,240,255,0.25); }
      [data-composition-id="s5-zero"] .r1 { top: 640px; }
      [data-composition-id="s5-zero"] .r2 { top: 1040px; border-color: #5a7a00; box-shadow: 0 0 40px rgba(198,255,46,0.35); }
      [data-composition-id="s5-zero"] .lab { position: absolute; left: 60px; top: 110px; font-family: "Anton", sans-serif; font-size: 120px; line-height: 1; color: #fff; }
      [data-composition-id="s5-zero"] .r2 .lab { color: #c6ff2e; }
      [data-composition-id="s5-zero"] .val { position: absolute; right: 70px; top: 20px; font-family: "Anton", sans-serif; font-size: 280px; line-height: 1;
        color: #fff; text-shadow: 0 0 24px rgba(255,255,255,0.5); }
      [data-composition-id="s5-zero"] .r2 .val { color: #c6ff2e; text-shadow: 0 0 30px rgba(198,255,46,0.9); }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 489;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const pulse = (el, f, s) => { tl.set(el, { scale: s }, G(f)); tl.to(el, { scale: 1, duration: D(9), ease: "power2.out" }, G(f)); };

        // F502 "3RD PERIOD", F508 Zeile SHOTS 0 (Puls auf "zero" F519), F568 Zeile GOALS 1 (auf "still scored")
        tl.fromTo("#s5a", { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: D(6), ease: "power3.out" }, G(502));
        tl.fromTo("#s5row1", { opacity: 0, x: -400 }, { opacity: 1, x: 0, duration: D(10), ease: "expo.out" }, G(508));
        pulse("#s5v1", 519, 1.12);
        shake("#s5cam", 510, 5, 12, 51);
        tl.fromTo("#s5row2", { opacity: 0, x: 400 }, { opacity: 1, x: 0, duration: D(10), ease: "expo.out" }, G(568));
        pulse("#s5v2", 580, 1.15);
        tl.set("#s5flash", { opacity: 0.2 }, G(580));
        tl.to("#s5flash", { opacity: 0, duration: D(5), ease: "power2.in" }, G(580));
        tl.fromTo("#s5cam", { scale: 1.04 }, { scale: 1, duration: D(111), ease: "power1.out" }, G(495));

        window.__timelines = window.__timelines || {};
        window.__timelines["s5-zero"] = tl;
      })();
    </script>
  </div>
</template>
