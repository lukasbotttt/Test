<template id="s1-hook-template">
  <!-- S1 HOOK · global 0–3,2 s (F0–95), lokal = global. Frage ab Bild 0; Torlampe blinkt am leeren Tor, ohne Schuss. -->
  <div data-composition-id="s1-hook" data-width="1080" data-height="1920" data-duration="3.2">
    <div class="scn">
      <div class="cam" id="s1cam" data-layout-allow-overflow>
        <div class="sky"></div>
        <div class="rinkwrap" data-layout-allow-overflow>
          <div id="s1rinkcam" class="rinkcam" data-layout-allow-overflow>
            <div id="s1plane" class="plane" data-layout-allow-overflow></div>
          </div>
        </div>
        <div class="vig" data-layout-ignore></div>
      </div>
      <div id="s1a" class="t" style="top:140px;font-size:170px">A GOAL</div>
      <div id="s1b" class="t lime" style="top:320px;font-size:150px">WITHOUT A SHOT?</div>
      <div id="s1flash" class="flash"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      @font-face { font-family: "JBMono"; src: url("fonts/JBMono700.ttf"); }
      [data-composition-id="s1-hook"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #02040c; }
      [data-composition-id="s1-hook"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s1-hook"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%); }
      [data-composition-id="s1-hook"] .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      [data-composition-id="s1-hook"] .t { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap;
        font-family: "Anton", sans-serif; line-height: 1; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s1-hook"] .lime { color: #c6ff2e; text-shadow: 0 0 22px rgba(198,255,46,0.85), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s1-hook"] .cyan { color: #00f0ff; text-shadow: 0 0 22px rgba(0,240,255,0.85), 0 10px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s1-hook"] .sky { position: absolute; inset: 0;
        background: radial-gradient(ellipse 80% 40% at 50% 70%, rgba(0,140,255,0.25), rgba(0,0,0,0) 70%), #02040c; }
      [data-composition-id="s1-hook"] .rinkwrap { position: absolute; left: 0; top: 360px; width: 1080px; height: 1560px; overflow: hidden; }
      [data-composition-id="s1-hook"] .rinkcam { position: absolute; left: 0; top: 0; width: 1080px; height: 1360px;
        perspective: 2400px; perspective-origin: 50% 100%; transform-origin: 50% 55%; }
      [data-composition-id="s1-hook"] .plane { position: absolute; left: 110px; top: -720px; width: 860px; height: 2021px;
        transform-origin: 50% 100%; transform: rotateX(44deg); }
      [data-composition-id="s1-hook"] .plane svg { position: absolute; left: 0; top: 0; filter: drop-shadow(0 0 10px rgba(0,240,255,0.7)); }
      [data-composition-id="s1-hook"] .flake { position: absolute; border-radius: 50%; background: rgba(240,248,255,0.92); opacity: 0;
        box-shadow: 0 0 8px rgba(255,255,255,0.6); }
      [data-composition-id="s1-hook"] .chip { position: absolute; width: 84px; height: 84px; border-radius: 50%; border: 6px solid #ffffff;
        font-family: "Anton", sans-serif; font-size: 40px; line-height: 72px; text-align: center; color: #fff; }
      [data-composition-id="s1-hook"] .chip.h { background: #ff1744; box-shadow: 0 0 26px rgba(255,23,68,0.95); }
      [data-composition-id="s1-hook"] .chip.a { background: #0095ff; box-shadow: 0 0 26px rgba(0,180,255,0.95); }
      [data-composition-id="s1-hook"] .chip.g { width: 100px; height: 100px; line-height: 88px; background: #e8f6ff; color: #0060c0; border-color: #0095ff;
        box-shadow: 0 0 26px rgba(0,180,255,0.95); }
      [data-composition-id="s1-hook"] .puck { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: #0a0a0f;
        border: 4px solid #e8f6ff; box-shadow: 0 0 14px rgba(255,255,255,0.8); }
      [data-composition-id="s1-hook"] .lampglow { position: absolute; width: 360px; height: 360px; border-radius: 50%; opacity: 0;
        background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,23,68,0.9) 28%, rgba(255,23,68,0) 70%); }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 0;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const pulse = (el, f, s) => { tl.set(el, { scale: s }, G(f)); tl.to(el, { scale: 1, duration: D(9), ease: "power2.out" }, G(f)); };

        // Eisfläche (Draufsicht, NHL-Maße 200 x 85 ft; Einheiten 760 x 1786, gezeichnet in 860 x 2021 px)
        const K = 860 / 760, plane = document.querySelector("#s1plane");
        plane.innerHTML = '<svg width="860" height="2021" viewBox="0 0 760 1786"><defs><linearGradient id="s1ice" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="#0a1a33"/><stop offset="1" stop-color="#0d2547"/></linearGradient></defs>' +
          '<rect x="6" y="6" width="748" height="1774" rx="250" fill="url(#s1ice)" stroke="#00f0ff" stroke-width="10"/>' +
          '<g fill="none"><line x1="6" y1="893" x2="754" y2="893" stroke="#ff1744" stroke-width="12"/>' +
          '<line x1="6" y1="670" x2="754" y2="670" stroke="#2f7bff" stroke-width="12"/><line x1="6" y1="1116" x2="754" y2="1116" stroke="#2f7bff" stroke-width="12"/>' +
          '<line x1="40" y1="98" x2="720" y2="98" stroke="#ff1744" stroke-width="4"/><line x1="40" y1="1688" x2="720" y2="1688" stroke="#ff1744" stroke-width="4"/>' +
          '<circle cx="380" cy="893" r="134" stroke="#2f7bff" stroke-width="5"/>' +
          '<circle cx="184" cy="277" r="134" stroke="#ff1744" stroke-width="5"/><circle cx="576" cy="277" r="134" stroke="#ff1744" stroke-width="5"/>' +
          '<circle cx="184" cy="1509" r="134" stroke="#ff1744" stroke-width="5"/><circle cx="576" cy="1509" r="134" stroke="#ff1744" stroke-width="5"/></g>' +
          '<path d="M326 98 A54 54 0 0 0 434 98 Z" fill="rgba(0,160,255,0.35)"/><path d="M326 1688 A54 54 0 0 1 434 1688 Z" fill="rgba(0,160,255,0.35)"/>' +
          '<rect x="353" y="60" width="54" height="38" fill="none" stroke="#ffffff" stroke-width="4"/><rect x="353" y="1688" width="54" height="38" fill="none" stroke="#ffffff" stroke-width="4"/>' +
          '<g fill="#ff1744"><circle cx="184" cy="715" r="9"/><circle cx="576" cy="715" r="9"/><circle cx="184" cy="1071" r="9"/><circle cx="576" cy="1071" r="9"/></g></svg>';
        const chip = (cls, num, x, y) => { const d = document.createElement("div"); d.className = "chip " + cls; d.textContent = num;
          const s = cls === "g" ? 50 : 42;
          d.style.left = Math.round(x * K - s) + "px"; d.style.top = Math.round(y * K - s) + "px"; plane.appendChild(d); return d; };
        const puck = (x, y) => { const d = document.createElement("div"); d.className = "puck";
          d.style.left = Math.round(x * K - 17) + "px"; d.style.top = Math.round(y * K - 17) + "px"; plane.appendChild(d); return d; };
        const lamp = () => { const d = document.createElement("div"); d.className = "lampglow";
          d.style.left = Math.round(380 * K - 180) + "px"; d.style.top = Math.round(70 * K - 180) + "px"; plane.appendChild(d); return d; };
        const mv = (d, x0, y0, x1, y1, f, n, ease) => tl.to(d, { x: (x1 - x0) * K, y: (y1 - y0) * K, duration: D(n), ease: ease || "sine.inOut" }, G(f));
        const flashLamp = (d, f, s) => { tl.set(d, { opacity: 1, scale: s || 0.8 }, G(f)); tl.to(d, { opacity: 0, scale: 1.6, duration: D(14), ease: "power2.out" }, G(f)); };
        // Rot mit Puck rast aufs leere Tor, Blau jagt hinterher – die Torlampe blinkt, obwohl kein Schuss fällt
        const r1 = chip("h", 9, 380, 1350), b1 = chip("a", 4, 450, 1500), p1 = puck(392, 1290), l1 = lamp();
        mv(r1, 380, 1350, 390, 520, 0, 96, "power1.inOut");
        mv(p1, 392, 1290, 402, 460, 0, 96, "power1.inOut");
        mv(b1, 450, 1500, 430, 640, 0, 96, "power1.inOut");
        [12, 42, 72].forEach((f) => flashLamp(l1, f, 0.9));
        tl.fromTo(["#s1a", "#s1b"], { scale: 1.05 }, { scale: 1, duration: D(6), ease: "power3.out" }, G(0));
        tl.fromTo("#s1rinkcam", { scale: 1.4, y: 140 }, { scale: 1.15, y: 0, duration: D(96), ease: "power2.out" }, G(0));
        shake("#s1cam", 2, 6, 16, 11);
        pulse("#s1b", 40, 1.06);
        [15, 75].forEach((f) => pulse("#s1b", f, 1.03));

        window.__timelines = window.__timelines || {};
        window.__timelines["s1-hook"] = tl;
      })();
    </script>
  </div>
</template>
