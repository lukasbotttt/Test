    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 264;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }

        const pulse = (el, f, s) => { tl.set(el, { scale: s }, G(f)); tl.to(el, { scale: 1, duration: D(9), ease: "power2.out" }, G(f)); };

        // F278 "JAN 2025", F323 "RYAN MCLEOD" (auf den Namen)

        tl.to("#s3slash", { rotation: -10, svgOrigin: "0 0", duration: D(14), ease: "power2.out" }, G(351));
        tl.to("#s3top", { x: -140, y: -220, rotation: -50, svgOrigin: "0 300", duration: D(26), ease: "power2.out" }, G(351));
        tl.to("#s3bot", { x: 120, y: 260, rotation: 38, svgOrigin: "0 300", duration: D(26), ease: "power2.out" }, G(351));
        (function () { const g = document.querySelector("#s3chips"), ns = "http://www.w3.org/2000/svg", r = rng(31);
          const cx = 470 + Math.sin(18 * Math.PI / 180) * 300, cy = 760 + Math.cos(18 * Math.PI / 180) * 300;
          for (let i = 0; i < 18; i++) {
            const e = document.createElementNS(ns, "rect"); e.setAttribute("x", cx); e.setAttribute("y", cy);
            e.setAttribute("width", 8 + r() * 14); e.setAttribute("height", 4 + r() * 6); e.setAttribute("opacity", 0); g.appendChild(e);
            const a = r() * Math.PI * 2, d = 120 + r() * 260;
            tl.set(e, { opacity: 1 }, G(351));
            tl.to(e, { x: Math.cos(a) * d, y: Math.sin(a) * d + 120, rotation: r() * 360, opacity: 0, duration: D(22), ease: "power2.out" }, G(351));
          } })();
        tl.set("#s3flash", { opacity: 0.45 }, G(351));

        shake("#s3cam", 351, 8, 24, 32);

        window.__timelines = window.__timelines || {};
        window.__timelines["s3-story"] = tl;
      })();
