<template id="s4-cta-template">
  <!-- S4 CTA · global 10,8–15,0 s (Frame 324–449), lokal = global − 324 Frames. Sichtbar 330–449. -->
  <div data-composition-id="s4-cta" data-width="1080" data-height="1920" data-duration="4.2">
    <div class="scn">
      <div class="cam" id="s4cam" data-layout-allow-overflow>
        <img id="s4bg" class="bg" src="assets/s4_bg.jpg" alt="">
        <img id="s4fg" class="fg" src="assets/s4_fg.png" alt="">
        <div class="vig"></div>
      </div>
      <div id="s4comm" class="comm" data-layout-allow-overflow>KOMMENTIERE:</div>
      <div id="s4bubble" class="bubble">„MOTION“</div>
      <div id="s4confetti" class="confbox"></div>
      <svg id="s4arrow" class="arrow" viewBox="0 0 220 200"><g fill="none" stroke="#00ffc8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="30,40 110,120 190,40"/><polyline points="30,100 110,180 190,100" opacity="0.55"/></g></svg>
      <div id="s4flash" class="flash"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      @font-face { font-family: "ArchivoX"; src: url("fonts/ArchivoX900.ttf"); }
      [data-composition-id="s4-cta"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #060210; }
      [data-composition-id="s4-cta"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s4-cta"] .bg { position: absolute; left: -40px; top: -70px; width: 1160px; height: 2060px; object-fit: cover; }
      [data-composition-id="s4-cta"] .fg { position: absolute; left: 90px; top: 760px; width: 900px; height: 1200px; object-fit: contain; }
      [data-composition-id="s4-cta"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.78) 100%); }
      [data-composition-id="s4-cta"] .comm { position: absolute; left: 0; top: 300px; width: 1080px; text-align: center; white-space: nowrap;
        font-family: "Anton", sans-serif; font-size: 150px; line-height: 1; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.85); }
      [data-composition-id="s4-cta"] .bubble { position: absolute; left: 140px; top: 520px; width: 800px; height: 190px; border-radius: 95px;
        background: rgba(40,0,60,0.85); border: 5px solid #ff2bd6;
        box-shadow: 0 0 40px rgba(255,43,214,0.9), inset 0 0 40px rgba(255,43,214,0.35);
        font-family: "ArchivoX", sans-serif; font-size: 112px; line-height: 190px; color: #fff; text-align: center;
        text-shadow: 0 0 20px rgba(0,255,200,0.9), 0 0 50px rgba(0,255,200,0.6); }
      [data-composition-id="s4-cta"] .confbox { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s4-cta"] .confetti { position: absolute; left: 532px; top: 607px; width: 16px; height: 26px; border-radius: 3px; opacity: 0; }
      [data-composition-id="s4-cta"] .arrow { position: absolute; left: 430px; top: 1300px; width: 220px; height: 200px; opacity: 0;
        filter: drop-shadow(0 0 16px rgba(0,255,200,0.9)); }
      [data-composition-id="s4-cta"] .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 324;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };

        tl.fromTo("#s4bg", { scale: 1.0 }, { scale: 1.06, duration: D(126), ease: "none" }, G(324));
        tl.fromTo("#s4fg", { y: 500 }, { y: 0, duration: D(14), ease: "expo.out" }, G(330));
        // F330 Münz-Ding: KOMMENTIERE: schießt von unten rein + Konfetti-Explosion
        tl.fromTo("#s4comm", { y: 1700 }, { y: 0, duration: D(10), ease: "expo.out" }, G(330));
        (function () {
          const box = document.querySelector("#s4confetti"), r = rng(61);
          const cols = ["#ff2bd6", "#00ffc8", "#ffcf40", "#00f0ff", "#ffffff", "#ff1744"];
          for (let i = 0; i < 48; i++) {
            const d = document.createElement("div");
            d.className = "confetti";
            d.style.background = cols[i % cols.length];
            box.appendChild(d);
            const ang = r() * Math.PI * 2, sp = 350 + r() * 650;
            tl.set(d, { opacity: 1, x: 0, y: 0, scale: 0.3, rotation: 0 }, G(330));
            tl.to(d, { x: Math.cos(ang) * sp, y: Math.sin(ang) * sp * 0.8 + 380, scale: 1, rotation: (r() * 2 - 1) * 720,
              opacity: 0, duration: D(36), ease: "power3.out" }, G(330));
          }
        })();
        // F346 (Wort "MOTION"): Neon-Bubble poppt; pulsiert auf den Beats 360/375/390/405 (Sub-Bass)
        tl.fromTo("#s4bubble", { scale: 0 }, { scale: 1, duration: D(8), ease: "back.out(2.6)" }, G(346));
        [360, 375, 390, 405].forEach((f) => {
          tl.set("#s4bubble", { scale: 1.09 }, G(f));
          tl.to("#s4bubble", { scale: 1, duration: D(8), ease: "power2.out" }, G(f));
        });
        // F375 (Wort "Kommentare"): Pfeil nach unten, hüpft auf jedem Beat
        tl.fromTo("#s4arrow", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: D(6), ease: "back.out(2)" }, G(375));
        [390, 405, 420, 435].forEach((f) => {
          tl.to("#s4arrow", { y: 40, duration: D(5), ease: "power2.out", yoyo: true, repeat: 1 }, G(f));
        });
        // F420 Sub-Bass-Impact: großer Puls + Blitz + Wackler, dann halten bis F449
        tl.set("#s4bubble", { scale: 1.22 }, G(420));
        tl.to("#s4bubble", { scale: 1, duration: D(12), ease: "power3.out" }, G(420));
        tl.set("#s4comm", { scale: 1.12 }, G(420));
        tl.to("#s4comm", { scale: 1, duration: D(12), ease: "power3.out" }, G(420));
        tl.set("#s4flash", { opacity: 0.35 }, G(420));
        tl.to("#s4flash", { opacity: 0, duration: D(5), ease: "power2.in" }, G(420));
        shake("#s4cam", 420, 10, 34, 71);

        window.__timelines = window.__timelines || {};
        window.__timelines["s4-cta"] = tl;
      })();
    </script>
  </div>
</template>
