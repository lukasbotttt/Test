<template id="s2-problem-template">
  <!-- S2 PROBLEM · global 2,8–7,2 s (Frame 84–215), lokal = global − 84 Frames. Sichtbar 90–209. -->
  <div data-composition-id="s2-problem" data-width="1080" data-height="1920" data-duration="4.4">
    <div class="scn">
      <div class="cam" id="s2cam">
        <img id="s2bg" class="bg" src="assets/s2_bg.jpg" alt="">
        <img id="s2fg" class="fg" src="assets/s2_fg.png" alt="">
        <div id="s2curve" class="curve" data-layout-allow-overflow>
          <svg width="1080" height="1920" viewBox="0 0 1080 1920">
            <defs><filter id="s2glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
            <polyline filter="url(#s2glow)" fill="none" stroke="#ff1744" stroke-width="16" stroke-linejoin="round"
              points="40,1040 120,1010 200,1030 280,995 360,1015 440,990 520,1005 600,985 650,995 700,1180 760,1420 820,1640 880,1840 920,2000"/>
          </svg>
        </div>
        <div class="vig"></div>
      </div>
      <div id="s2lang" class="txt" style="top:330px; font-size:190px">
        <span class="lay r" aria-hidden="true" data-layout-allow-overlap>LANGWEILIG</span><span class="lay c" aria-hidden="true" data-layout-allow-overlap>LANGWEILIG</span><span class="lay main w" data-layout-allow-overlap>LANGWEILIG</span></div>
      <div id="s2over" class="txt" style="top:560px; font-size:170px">
        <span class="lay r" aria-hidden="true" data-layout-allow-overlap>= GAME OVER</span><span class="lay c" aria-hidden="true" data-layout-allow-overlap>= GAME OVER</span><span class="lay main red" data-layout-allow-overlap>= GAME OVER</span></div>
      <svg id="s2crack1" class="crack" viewBox="0 0 1080 1920"><g fill="none" stroke="#ffffff" stroke-width="5">
        <polyline points="880,1700 820,1560 845,1470 760,1330 790,1210"/><polyline points="880,1700 990,1580 1040,1450 1080,1400"/>
        <polyline points="880,1700 700,1690 620,1610 480,1640 380,1560"/><polyline points="880,1700 930,1850 1000,1920"/>
        <polyline points="845,1470 950,1420 1010,1300"/><polyline points="620,1610 600,1480 520,1420"/></g></svg>
      <svg id="s2crack2" class="crack" viewBox="0 0 1080 1920"><g fill="none" stroke="#ff4d6d" stroke-width="4">
        <polyline points="880,1700 760,1800 600,1820 450,1900"/><polyline points="790,1210 700,1100 720,980"/>
        <polyline points="480,1640 360,1720 220,1700 90,1780"/></g></svg>
      <div id="s2pulse" class="pulse"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      [data-composition-id="s2-problem"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #01040c; }
      [data-composition-id="s2-problem"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s2-problem"] .bg { position: absolute; left: -40px; top: -70px; width: 1160px; height: 2060px; object-fit: cover; }
      [data-composition-id="s2-problem"] .fg { position: absolute; left: 90px; top: 560px; width: 900px; height: 1200px; object-fit: contain; }
      [data-composition-id="s2-problem"] .curve { position: absolute; left: 0; top: 0; width: 0px; height: 1920px; overflow: hidden; }
      [data-composition-id="s2-problem"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.78) 100%); }
      [data-composition-id="s2-problem"] .txt { position: absolute; left: 0; width: 1080px; height: 220px; opacity: 0;
        font-family: "Anton", sans-serif; line-height: 1; text-align: center; }
      [data-composition-id="s2-problem"] .lay { position: absolute; left: 0; top: 0; width: 1080px; text-align: center; white-space: nowrap; }
      [data-composition-id="s2-problem"] .lay.r { color: #ff0050; mix-blend-mode: screen; }
      [data-composition-id="s2-problem"] .lay.c { color: #00f0ff; mix-blend-mode: screen; }
      [data-composition-id="s2-problem"] .lay.w { color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.85); }
      [data-composition-id="s2-problem"] .lay.red { color: #ff1744; -webkit-text-stroke: 4px #14000a; paint-order: stroke fill; text-shadow: 0 0 18px rgba(255,23,68,0.9), 0 0 60px rgba(255,23,68,0.6); }
      [data-composition-id="s2-problem"] .crack { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0;
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.8)); }
      [data-composition-id="s2-problem"] .pulse { position: absolute; inset: 0; opacity: 0;
        background: radial-gradient(ellipse at center, rgba(255,0,40,0) 35%, rgba(255,0,40,0.6) 100%); }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 84;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const split = (sel, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const a = amp * (0.4 + 0.6 * r());
            tl.set(sel + " .r", { x: -a, y: (r() - 0.5) * 6 }, G(f0 + i)); tl.set(sel + " .c", { x: a, y: (r() - 0.5) * 6 }, G(f0 + i)); }
          tl.set([sel + " .r", sel + " .c"], { x: 0, y: 0 }, G(f0 + n)); };

        // Langsame Kamerafahrt, Handy (freigestellt) sinkt und "schmilzt"
        tl.fromTo("#s2bg", { scale: 1.0 }, { scale: 1.07, duration: D(130), ease: "none" }, G(84));
        tl.fromTo("#s2fg", { y: 0, scale: 1.0 }, { y: 50, scale: 1.08, duration: D(130), ease: "sine.inOut" }, G(84));
        // F96–160: Retention-Kurve zeichnet das Plateau
        tl.fromTo("#s2curve", { width: 0 }, { width: 650, duration: D(64), ease: "none" }, G(96));
        // F120 Vinyl-Scratch: LANGWEILIG knallt rein · F150: = GAME OVER
        tl.fromTo("#s2lang", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: D(6), ease: "back.out(2)" }, G(120));
        tl.fromTo("#s2over", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: D(6), ease: "back.out(2)" }, G(150));
        // Text-Glitch: Wackeln alle 2 Frames, gelegentlich stark + RGB-Split
        (function () { const r = rng(31);
          for (let f = 126; f < 206; f += 2) { const a = r() < 0.25 ? 12 : 3;
            tl.set(["#s2lang", "#s2over"], { x: (r() * 2 - 1) * a, rotation: (r() * 2 - 1) * 0.6 }, G(f)); }
          tl.set(["#s2lang", "#s2over"], { x: 0, rotation: 0 }, G(206)); })();
        split("#s2lang", 120, 86, 9, 32);
        split("#s2over", 150, 56, 9, 33);
        // F165–180: Kurve stürzt ab und bricht durch den unteren Bildrand
        tl.to("#s2curve", { width: 1080, duration: D(15), ease: "power3.in" }, G(165));
        // F180 Herzschlag 1: Risse, rote Vignette, Wackler
        tl.set("#s2crack1", { opacity: 1, scale: 0.7, transformOrigin: "880px 1700px" }, G(180));
        tl.to("#s2crack1", { scale: 1, duration: D(5), ease: "power4.out" }, G(180));
        tl.set("#s2pulse", { opacity: 0.9 }, G(180));
        tl.to("#s2pulse", { opacity: 0.15, duration: D(7), ease: "power2.out" }, G(180));
        shake("#s2cam", 180, 8, 30, 34);
        // F188 Herzschlag 2
        tl.set("#s2crack2", { opacity: 1, scale: 0.8, transformOrigin: "880px 1700px" }, G(188));
        tl.to("#s2crack2", { scale: 1, duration: D(4), ease: "power4.out" }, G(188));
        tl.set("#s2pulse", { opacity: 0.75 }, G(188));
        tl.to("#s2pulse", { opacity: 0.1, duration: D(10), ease: "power2.out" }, G(188));
        shake("#s2cam", 188, 6, 18, 35);

        window.__timelines = window.__timelines || {};
        window.__timelines["s2-problem"] = tl;
      })();
    </script>
  </div>
</template>
