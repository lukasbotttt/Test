<template id="s3-solution-template">
  <!-- S3 LÖSUNG · global 6,8–11,2 s (Frame 204–335), lokal = global − 204 Frames. Sichtbar 210–329. -->
  <div data-composition-id="s3-solution" data-width="1080" data-height="1920" data-duration="4.4">
    <div class="scn">
      <div class="cam" id="s3cam">
        <img id="s3bg" class="bg" src="assets/s3_bg.jpg" alt="">
        <div class="ringwrap" style="top:760px"><svg id="s3ring1" class="ring" viewBox="0 0 900 900">
          <circle cx="450" cy="450" r="430" fill="none" stroke="#ffcf40" stroke-width="10" stroke-dasharray="220 60 40 60" stroke-linecap="round"/></svg></div>
        <img id="s3fg" class="fg" src="assets/s3_fg.png" alt="">
        <div class="ringwrap" style="top:820px"><svg id="s3ring2" class="ring" viewBox="0 0 900 900">
          <circle cx="450" cy="450" r="400" fill="none" stroke="#ff9d00" stroke-width="7" stroke-dasharray="120 80 300 90" stroke-linecap="round"/></svg></div>
        <div class="ringwrap" style="top:700px"><svg id="s3ring3" class="ring" viewBox="0 0 900 900">
          <circle cx="450" cy="450" r="445" fill="none" stroke="#fff1b0" stroke-width="4" stroke-dasharray="30 50" stroke-linecap="round"/></svg></div>
        <div class="vig"></div>
      </div>
      <div id="s3pill" class="pill">CLAUDE × HYPERFRAMES</div>
      <div id="s3max" class="t gold" style="top:350px; font-size:190px">MAXIMAL</div>
      <div id="s3krass" class="t white" style="top:575px; font-size:250px">KRASS</div>
      <div id="s3gold" class="gold-flash"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      @font-face { font-family: "JBMono"; src: url("fonts/JBMono700.ttf"); }
      [data-composition-id="s3-solution"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0d0700; }
      [data-composition-id="s3-solution"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s3-solution"] .bg { position: absolute; left: -40px; top: -70px; width: 1160px; height: 2060px; object-fit: cover; }
      [data-composition-id="s3-solution"] .fg { position: absolute; left: 90px; top: 640px; width: 900px; height: 1200px; object-fit: contain; }
      [data-composition-id="s3-solution"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.75) 100%); }
      [data-composition-id="s3-solution"] .ringwrap { position: absolute; left: 90px; width: 900px; height: 900px; transform: scaleY(0.32) rotate(-14deg); }
      [data-composition-id="s3-solution"] .ring { position: absolute; left: 0; top: 0; width: 900px; height: 900px;
        filter: drop-shadow(0 0 14px rgba(255,190,40,0.9)); }
      [data-composition-id="s3-solution"] .pill { position: absolute; left: 240px; top: 250px; width: 600px; height: 76px; border-radius: 38px;
        background: rgba(20,12,0,0.78); border: 3px solid #ffcf40; box-shadow: 0 0 30px rgba(255,190,40,0.6);
        font-family: "JBMono", monospace; font-size: 34px; color: #ffcf40; text-align: center; line-height: 76px; letter-spacing: 2px; opacity: 0; }
      [data-composition-id="s3-solution"] .t { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap;
        font-family: "Anton", sans-serif; line-height: 1; opacity: 0; }
      [data-composition-id="s3-solution"] .gold { color: #ffcf40; text-shadow: 0 0 20px rgba(255,190,40,0.95), 0 0 70px rgba(255,150,0,0.7); }
      [data-composition-id="s3-solution"] .white { color: #fff; text-shadow: 0 0 30px rgba(255,200,60,1), 0 0 90px rgba(255,150,0,0.9); }
      [data-composition-id="s3-solution"] .gold-flash { position: absolute; inset: 0; background: #ffd25a; mix-blend-mode: screen; opacity: 0; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 204;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };

        // Hintergrund zieht zurück, Roboter (freigestellt) steigt auf und wächst -> Tiefenwirkung
        tl.fromTo("#s3bg", { scale: 1.08 }, { scale: 1.0, duration: D(126), ease: "power1.out" }, G(204));
        tl.fromTo("#s3fg", { y: 120, scale: 0.9 }, { y: 0, scale: 1.0, duration: D(24), ease: "power3.out" }, G(210));
        tl.to("#s3fg", { scale: 1.08, duration: D(96), ease: "none" }, G(234));
        // Goldene Speed-Lines umkreisen das Objekt: beschleunigen mit dem Riser (F210–270), danach Vollgas
        tl.fromTo("#s3ring1", { rotation: 0 }, { rotation: 540, duration: D(60), ease: "power2.in" }, G(210));
        tl.to("#s3ring1", { rotation: 1980, duration: D(60), ease: "none" }, G(270));
        tl.fromTo("#s3ring2", { rotation: 0 }, { rotation: -720, duration: D(60), ease: "power2.in" }, G(210));
        tl.to("#s3ring2", { rotation: -2520, duration: D(60), ease: "none" }, G(270));
        tl.fromTo("#s3ring3", { rotation: 0 }, { rotation: 360, duration: D(60), ease: "power2.in" }, G(210));
        tl.to("#s3ring3", { rotation: 1440, duration: D(60), ease: "none" }, G(270));
        // F222 (Wort "Claude"): Pille fährt rein
        tl.fromTo("#s3pill", { opacity: 0, x: -300 }, { opacity: 1, x: 0, duration: D(8), ease: "expo.out" }, G(222));
        // F270 Laser-Zap: Gold-Blitz + Glow-In MAXIMAL, F276 KRASS
        tl.set("#s3gold", { opacity: 0.7 }, G(270));
        tl.to("#s3gold", { opacity: 0, duration: D(8), ease: "power2.out" }, G(270));
        tl.fromTo("#s3max", { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: D(8), ease: "power3.out" }, G(270));
        tl.fromTo("#s3krass", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: D(8), ease: "power3.out" }, G(276));
        tl.to("#s3krass", { scale: 1.06, duration: D(4), ease: "power2.out", yoyo: true, repeat: 1 }, G(300));
        shake("#s3cam", 270, 8, 22, 41);

        window.__timelines = window.__timelines || {};
        window.__timelines["s3-solution"] = tl;
      })();
    </script>
  </div>
</template>
