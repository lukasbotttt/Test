<template id="s1-hook-template">
  <!-- S1 HOOK · global 0,0–3,2 s (Frame 0–95), lokal = global. Schnitt zu S2 bei Frame 90. -->
  <div data-composition-id="s1-hook" data-width="1080" data-height="1920" data-duration="3.2">
    <div class="scn">
      <div class="cam" id="s1cam">
        <img id="s1bg" class="bg" src="assets/s1_bg.jpg" alt="">
        <img id="s1fg" class="fg" src="assets/s1_fg.png" alt="">
        <div class="vig"></div>
      </div>
      <div id="s1hoer" class="word">
        <span class="lay r" aria-hidden="true" data-layout-allow-overlap>HÖR</span><span class="lay c" aria-hidden="true" data-layout-allow-overlap>HÖR</span><span class="lay main" data-layout-allow-overlap>HÖR</span></div>
      <div id="s1auf" class="word">
        <span class="lay r" aria-hidden="true" data-layout-allow-overlap>AUF</span><span class="lay c" aria-hidden="true" data-layout-allow-overlap>AUF</span><span class="lay main" data-layout-allow-overlap>AUF</span></div>
      <div id="s1scroll" class="scroll" data-layout-allow-overflow>ZU SCROLLEN</div>
      <div id="s1sub" class="sub">DAS ÄNDERT ALLES.</div>
      <div id="s1flash" class="flash"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      @font-face { font-family: "JBMono"; src: url("fonts/JBMono700.ttf"); }
      [data-composition-id="s1-hook"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #05010d; }
      [data-composition-id="s1-hook"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s1-hook"] .bg { position: absolute; left: -40px; top: -70px; width: 1160px; height: 2060px; object-fit: cover; }
      [data-composition-id="s1-hook"] .fg { position: absolute; left: 90px; top: 640px; width: 900px; height: 1200px; object-fit: contain; }
      [data-composition-id="s1-hook"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.78) 100%); }
      [data-composition-id="s1-hook"] .word { position: absolute; top: 330px; width: 540px; height: 330px;
        font-family: "Anton", sans-serif; font-size: 280px; line-height: 1; text-align: center; }
      [data-composition-id="s1-hook"] #s1hoer { left: 40px; }
      [data-composition-id="s1-hook"] #s1auf { left: 500px; opacity: 0; }
      [data-composition-id="s1-hook"] .lay { position: absolute; left: 0; top: 0; width: 540px; text-align: center; }
      [data-composition-id="s1-hook"] .lay.r { color: #ff0050; mix-blend-mode: screen; }
      [data-composition-id="s1-hook"] .lay.c { color: #00f0ff; mix-blend-mode: screen; }
      [data-composition-id="s1-hook"] .lay.main { color: #ff1744; -webkit-text-stroke: 5px #14000a; paint-order: stroke fill;
        text-shadow: 0 0 18px rgba(255,23,68,0.9), 0 0 60px rgba(255,23,68,0.6), 0 12px 40px rgba(0,0,0,0.9); }
      [data-composition-id="s1-hook"] .scroll { position: absolute; left: 0; top: 700px; width: 1080px; text-align: center;
        font-family: "Anton", sans-serif; font-size: 120px; line-height: 1; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.85); }
      [data-composition-id="s1-hook"] .sub { position: absolute; left: 0; top: 1440px; width: 1080px; text-align: center;
        font-family: "JBMono", monospace; font-size: 44px; color: #00f0ff; letter-spacing: 4px; opacity: 0;
        text-shadow: 0 0 16px rgba(0,240,255,0.8); }
      [data-composition-id="s1-hook"] .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 0;                                     // Szenenstart in globalen Frames
        const G = (f) => (f - OFF) / 30;                   // globaler Frame -> lokale Sekunde
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };
        const split = (sel, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const a = amp * (0.4 + 0.6 * r());
            tl.set(sel + " .r", { x: -a, y: (r() - 0.5) * 6 }, G(f0 + i)); tl.set(sel + " .c", { x: a, y: (r() - 0.5) * 6 }, G(f0 + i)); }
          tl.set([sel + " .r", sel + " .c"], { x: 0, y: 0 }, G(f0 + n)); };

        // F0 Bass-Drop: HÖR ist ab Bild 0 sichtbar und knallt von 118 % auf 100 %, Kamera wackelt 12 Frames
        tl.fromTo("#s1hoer", { scale: 1.18 }, { scale: 1, duration: G(5), ease: "power4.out" }, G(0));
        shake("#s1cam", 0, 12, 46, 11);
        split("#s1hoer", 0, 10, 16, 12);
        // F8: AUF
        tl.fromTo("#s1auf", { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: G(5), ease: "power4.out" }, G(8));
        split("#s1auf", 8, 8, 14, 13);
        shake("#s1cam", 8, 6, 18, 14);
        // F15 (Beat 2): ZU SCROLLEN skaliert von 0 auf 150 %
        tl.fromTo("#s1scroll", { scale: 0 }, { scale: 1.5, duration: G(9), ease: "back.out(2.2)" }, G(15));
        // Objekt-Separation: Vordergrund zoomt auf den Zuschauer zu, Hintergrund langsamer (Parallaxe)
        tl.fromTo("#s1bg", { scale: 1.0 }, { scale: 1.06, duration: G(96), ease: "none" }, G(0));
        tl.fromTo("#s1fg", { scale: 0.92, y: 60 }, { scale: 1.22, y: -40, duration: G(96), ease: "power1.in" }, G(0));
        // F40: Unterzeile ("Das hier wird alles verändern")
        tl.fromTo("#s1sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: G(6), ease: "power2.out" }, G(40));
        // F60 Kamera-Shutter: weißer Blitz 4 Frames + Kamera-Stoß
        tl.set("#s1flash", { opacity: 0.95 }, G(60));
        tl.to("#s1flash", { opacity: 0, duration: G(4), ease: "power2.in" }, G(60));
        tl.set("#s1cam", { scale: 1.05 }, G(60));
        tl.to("#s1cam", { scale: 1.0, duration: G(6), ease: "power3.out" }, G(60));

        window.__timelines = window.__timelines || {};
        window.__timelines["s1-hook"] = tl;
      })();
    </script>
  </div>
</template>
