<template id="s4-cta-template">
  <!-- S4 CTA · global 10,8–15,0 s (F324–449), lokal = global − 324. Kommentar "GAMEDAY" -> Gratis-Probe. -->
  <div data-composition-id="s4-cta" data-width="1080" data-height="1920" data-duration="4.2">
    <div class="scn">
      <div class="cam" id="s4cam" data-layout-allow-overflow>
        <div class="sky"></div>
        <div id="s4bokeh" class="bokeh"></div>
        <!-- Vordergrund-Objekt: Handy (Vektor) mit Kommentarfeld -->
        <div id="s4phone" class="phone">
          <img class="logo" src="assets/nm_symbol.svg" alt="">
          <div class="p1">FREE SAMPLE</div>
          <div class="p2">FOR YOUR CLUB</div>
          <div class="field">
            <div class="avatar"></div>
            <div class="typed"><span>G</span><span>A</span><span>M</span><span>E</span><span>D</span><span>A</span><span>Y</span><i id="s4cursor"></i></div>
            <div id="s4post" class="post">POST</div>
          </div>
        </div>
        <div class="vig" data-layout-ignore></div>
      </div>
      <div id="s4comm" class="comm" data-layout-allow-overflow>COMMENT:</div>
      <div id="s4bubble" class="bubble">GAMEDAY</div>
      <div id="s4confetti" class="confbox"></div>
      <svg id="s4arrow" class="arrow" viewBox="0 0 220 200"><g fill="none" stroke="#c6ff2e" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="30,40 110,120 190,40"/><polyline points="30,100 110,180 190,100" opacity="0.55"/></g></svg>
      <div id="s4flash" class="flash"></div>
    </div>

    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
      @font-face { font-family: "ArchivoX"; src: url("fonts/ArchivoX900.ttf"); }
      @font-face { font-family: "JBMono"; src: url("fonts/JBMono700.ttf"); }
      [data-composition-id="s4-cta"] .scn { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #070212; }
      [data-composition-id="s4-cta"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s4-cta"] .sky { position: absolute; inset: 0;
        background: radial-gradient(ellipse 60% 40% at 25% 35%, rgba(190,0,255,0.35), rgba(0,0,0,0) 70%),
                    radial-gradient(ellipse 60% 40% at 80% 75%, rgba(0,255,170,0.25), rgba(0,0,0,0) 70%), #070212; }
      [data-composition-id="s4-cta"] .bokeh { position: absolute; inset: 0; }
      [data-composition-id="s4-cta"] .bk { position: absolute; border-radius: 50%; }
      [data-composition-id="s4-cta"] .phone { position: absolute; left: 290px; top: 860px; width: 500px; height: 620px; border-radius: 56px;
        background: linear-gradient(170deg, #17121f 0%, #07050b 100%); border: 6px solid #ff2bd6;
        box-shadow: 0 0 40px rgba(255,43,214,0.8), 0 40px 80px rgba(0,0,0,0.85); }
      [data-composition-id="s4-cta"] .logo { position: absolute; left: 125px; top: 60px; width: 250px; height: 66px; }
      [data-composition-id="s4-cta"] .p1 { position: absolute; left: 0; top: 170px; width: 488px; text-align: center; font-family: "Anton", sans-serif;
        font-size: 86px; line-height: 1; color: #fff; }
      [data-composition-id="s4-cta"] .p2 { position: absolute; left: 0; top: 270px; width: 488px; text-align: center; font-family: "ArchivoX", sans-serif;
        font-size: 30px; color: #c6ff2e; letter-spacing: 2px; }
      [data-composition-id="s4-cta"] .field { position: absolute; left: 30px; top: 470px; width: 428px; height: 90px; border-radius: 45px;
        background: #1d1826; border: 2px solid #3a3346; }
      [data-composition-id="s4-cta"] .avatar { position: absolute; left: 14px; top: 17px; width: 56px; height: 56px; border-radius: 50%;
        background: linear-gradient(135deg, #ff2bd6, #00ffc8); }
      [data-composition-id="s4-cta"] .typed { position: absolute; left: 86px; top: 0; height: 90px; line-height: 90px; font-family: "ArchivoX", sans-serif;
        font-size: 34px; color: #fff; white-space: nowrap; }
      [data-composition-id="s4-cta"] .typed span { opacity: 0; }
      [data-composition-id="s4-cta"] .typed i { display: inline-block; width: 4px; height: 40px; margin-left: 4px; vertical-align: middle; background: #c6ff2e; }
      [data-composition-id="s4-cta"] .post { position: absolute; right: 14px; top: 17px; width: 96px; height: 56px; border-radius: 28px; text-align: center;
        line-height: 56px; font-family: "JBMono", monospace; font-size: 22px; color: #555; background: #2a2433; }
      [data-composition-id="s4-cta"] .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.78) 100%); }
      [data-composition-id="s4-cta"] .comm { position: absolute; left: 0; top: 250px; width: 1080px; text-align: center; white-space: nowrap;
        font-family: "Anton", sans-serif; font-size: 170px; line-height: 1; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.85); }
      [data-composition-id="s4-cta"] .bubble { position: absolute; left: 150px; top: 470px; width: 780px; height: 180px; border-radius: 90px;
        background: rgba(12,20,0,0.88); border: 5px solid #c6ff2e;
        box-shadow: 0 0 40px rgba(198,255,46,0.9), inset 0 0 40px rgba(198,255,46,0.3);
        font-family: "ArchivoX", sans-serif; font-size: 106px; line-height: 180px; color: #fff; text-align: center;
        text-shadow: 0 0 20px rgba(198,255,46,0.95), 0 0 50px rgba(198,255,46,0.6); transform-origin: 50% 50%; }
      [data-composition-id="s4-cta"] .confbox { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      [data-composition-id="s4-cta"] .confetti { position: absolute; left: 532px; top: 547px; width: 16px; height: 26px; border-radius: 3px; opacity: 0; }
      [data-composition-id="s4-cta"] .arrow { position: absolute; left: 470px; top: 680px; width: 140px; height: 128px; opacity: 0;
        filter: drop-shadow(0 0 16px rgba(198,255,46,0.9)); }
      [data-composition-id="s4-cta"] .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        const OFF = 324;
        const G = (f) => (f - OFF) / 30;
        const D = (n) => n / 30;
        const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const tl = gsap.timeline({ paused: true });
        const shake = (el, f0, n, amp, seed) => { const r = rng(seed);
          for (let i = 0; i < n; i++) { const k = amp * (1 - i / n); tl.set(el, { x: (r() * 2 - 1) * k, y: (r() * 2 - 1) * k }, G(f0 + i)); }
          tl.set(el, { x: 0, y: 0 }, G(f0 + n)); };

        // Bokeh-Lichter treiben (Tiefe hinter dem Handy)
        (function () { const box = document.querySelector("#s4bokeh"), r = rng(9);
          const cols = ["rgba(255,43,214,0.35)", "rgba(0,255,200,0.3)", "rgba(198,255,46,0.25)"];
          for (let i = 0; i < 18; i++) {
            const d = document.createElement("div"); d.className = "bk";
            const s = 30 + r() * 110; d.style.width = s + "px"; d.style.height = s + "px";
            d.style.left = Math.round(r() * 1080) + "px"; d.style.top = Math.round(r() * 1920) + "px";
            d.style.background = cols[i % 3]; d.style.filter = "blur(" + Math.round(4 + r() * 10) + "px)";
            box.appendChild(d);
            tl.fromTo(d, { y: 0 }, { y: -120 - r() * 160, duration: D(126), ease: "none" }, G(324));
          } })();
        // F330 Münz-Ding: Handy fährt hoch, COMMENT: schießt von unten rein, Konfetti
        tl.fromTo("#s4phone", { y: 700, rotation: 6 }, { y: 0, rotation: 0, duration: D(14), ease: "expo.out" }, G(330));
        tl.to("#s4phone", { scale: 1.05, duration: D(80), ease: "none" }, G(344));
        tl.fromTo("#s4comm", { y: 1700 }, { y: 0, duration: D(10), ease: "expo.out" }, G(330));
        (function () { const box = document.querySelector("#s4confetti"), r = rng(61);
          const cols = ["#c6ff2e", "#ff2bd6", "#00ffc8", "#ffffff", "#ff1744", "#00f0ff"];
          for (let i = 0; i < 48; i++) {
            const d = document.createElement("div"); d.className = "confetti"; d.style.background = cols[i % cols.length];
            box.appendChild(d);
            const ang = r() * Math.PI * 2, sp = 350 + r() * 650;
            tl.set(d, { opacity: 1, x: 0, y: 0, scale: 0.3, rotation: 0 }, G(330));
            tl.to(d, { x: Math.cos(ang) * sp, y: Math.sin(ang) * sp * 0.8 + 380, scale: 1, rotation: (r() * 2 - 1) * 720,
              opacity: 0, duration: D(36), ease: "power3.out" }, G(330));
          } })();
        // F346: Bubble GAMEDAY poppt, pulsiert auf den Beats (Sub-Bass)
        tl.fromTo("#s4bubble", { scale: 0 }, { scale: 1, duration: D(8), ease: "back.out(2.6)" }, G(346));
        [360, 375, 390, 405].forEach((f) => {
          tl.set("#s4bubble", { scale: 1.09 }, G(f));
          tl.to("#s4bubble", { scale: 1, duration: D(8), ease: "power2.out" }, G(f));
        });
        // F352–376: GAMEDAY wird ins Kommentarfeld getippt, F380 POST leuchtet
        document.querySelectorAll('[data-composition-id="s4-cta"] .typed span').forEach((el, i) => {
          tl.set(el, { opacity: 1 }, G(352 + i * 3));
        });
        for (let f = 330; f < 450; f += 8) tl.set("#s4cursor", { opacity: (f / 8) % 2 < 1 ? 1 : 0 }, G(f));
        tl.set("#s4post", { backgroundColor: "#c6ff2e", color: "#0a0d02" }, G(380));
        tl.fromTo("#s4post", { scale: 1.25 }, { scale: 1, duration: D(8), ease: "back.out(2)" }, G(380));
        // F375: Pfeil nach unten aufs Kommentarfeld, hüpft auf jedem Beat
        tl.fromTo("#s4arrow", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: D(6), ease: "back.out(2)" }, G(375));
        [390, 405, 420, 435].forEach((f) => {
          tl.to("#s4arrow", { y: 34, duration: D(5), ease: "power2.out", yoyo: true, repeat: 1 }, G(f));
        });
        // F420 Sub-Bass-Impact
        tl.set("#s4bubble", { scale: 1.22 }, G(420));
        tl.to("#s4bubble", { scale: 1, duration: D(12), ease: "power3.out" }, G(420));
        tl.set("#s4comm", { scale: 1.12 }, G(420));
        tl.to("#s4comm", { scale: 1, duration: D(12), ease: "power3.out" }, G(420));
        tl.set("#s4flash", { opacity: 0.35 }, G(420));
        tl.to("#s4flash", { opacity: 0, duration: D(5), ease: "power2.in" }, G(420));
        shake("#s4cam", 420, 10, 34, 71);

        window.__timelines = window.__timelines || {};
        window.__timelines["s4-cta"] = tl;
      })();
    </script>
  </div>
</template>
